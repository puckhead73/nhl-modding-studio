[package]
name = "tdb-fhm-store"
description = "Read-mostly access layer over the FHM SQLite corpus — search/filter/detail queries."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tdb-fhm = { path = "../tdb-fhm" }
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
