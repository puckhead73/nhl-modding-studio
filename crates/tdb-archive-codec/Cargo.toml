[package]
name = "tdb-archive-codec"
description = "EA archive container codecs — chunkzip read (chunklzx detection), refpack, DDS. Backs the .big extractor and the asset tools."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
thiserror = "1"
# `zlib` = real zlib (libz-sys, bundled 1.3.x): the chunkzip encoder reproduces EA's stock members
# byte-for-byte with it (research handoff 02 §3.2: zlib 1.3.1 level 9, 295/295), which the default
# miniz_oxide backend does not (1/26). Decompression is identical on either backend.
flate2 = { version = "1", features = ["zlib"] }
texpresso = "2"

[dev-dependencies]
sha2 = "0.10"
serde_json = "1"
