[package]
name = "studio-api"
description = "NHL Modding Studio — Tauri command surface, session registry, and generated DTOs."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "10"
# Portrait previews cross the Tauri boundary as PNG data URLs.
base64 = "0.22"
studio-domain = { path = "../studio-domain" }
# The non-blocking Roster Builder import ledger (dedup warnings). Owned by the service layer.
tdb-instance-registry = { path = "../tdb-instance-registry" }
# Used by the `edit-qa` headless QA binary to re-parse saved artifacts and verify round-trip/CRC.
tdb-core = { path = "../tdb-core" }
tdb-savedata = { path = "../tdb-savedata" }

# Headless edit-QA runner: drives the Registry seam across the anchor matrix, deposits edited
# artifacts + markdown reports. See src/bin/edit_qa.rs.
[[bin]]
name = "edit-qa"
path = "src/bin/edit_qa.rs"

[dev-dependencies]
# Build a synthetic FHM corpus file for the Roster Builder import round-trip test (bundled SQLite is
# already compiled elsewhere in the workspace).
rusqlite = { version = "0.31", features = ["bundled"] }
tdb-fhm = { path = "../tdb-fhm" }
