[package]
name = "tdb-headmesh"
description = "Game-to-game headmesh conversion engine — per-pair capability matrix, weight remap (Path A), donor morph (Path B), pack/texture/QA/install stages."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
tdb-rx2 = { path = "../tdb-rx2" }
tdb-archive-codec = { path = "../tdb-archive-codec" }
blender-job = { path = "../blender-job" }
thiserror = "1"
# CC5 (Path C) ships its head atlas as PNG/JPEG rather than DDS.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "headmesh"
path = "src/bin/headmesh.rs"
