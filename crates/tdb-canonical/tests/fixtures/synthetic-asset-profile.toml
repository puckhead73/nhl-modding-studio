# ============================== synthetic target exercising correlated variants and partial values

[[target_profile]]
target = "fixturethree-synthetic"
note = """
Exercises the `/3` additions end to end: two path families, three correlated variants whose selectors
overlap in a way one query can resolve and another cannot, a partially known raster block, and an
[atlas] established on `sharing` with its `kind` deliberately unknown.

The `hero` variant carries a `target-required` codec so the REFUSAL path has a test; the `banner`
variants carry `observed-source-format`, so a Build asking for a different codec there is BLOCKED
rather than refused. That difference is the whole point of the force axis and it is only exercisable
on a fixture, because no real target here has a demonstrated target requirement.
"""

[[target_profile.corpus]]
id = "fixture-three-copy"
kind = "observed-installed-copy"
attribution = "attributable-to-target"
build_identification = "incomplete"
identity_source = "synthetic:fixture container header"
inspected_files = 8192
groups = ["current", "backup-labelled"]
limitations = ["synthetic:fixture records no build string, so the exact build behind this corpus is unidentified."]
provenance = ["synthetic:fixture"]

[[target_profile.corpus]]
