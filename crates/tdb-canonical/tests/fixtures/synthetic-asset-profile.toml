# SYNTHETIC FIXTURE — every value below is INVENTED.
#
# It exists to exercise the `asset-output-profile/3` representations for which no real fact is
# established anywhere in this repository: mesh vertex layouts, UV conventions, rigs and palettes,
# audio bank/sample constraints, atlases and pools, mip policies, tiling alignment, the
# `not-applicable` state, the candidate channel, correlated variants with structured selectors,
# per-sub-property evidence, and — nowhere else in the repository — an established constraint at
# `supported-target-constraint` scope carrying `force = "target-required"`.
#
# `fixturefour-synthetic` carries the three C0-AS3-R1 representations no real profile exercises:
# two variants of one family arriving in DIFFERENT container chains, a `[corpus.bridge]` that
# carries attribution across an extraction, and an established constraint at `specimen-observation`
# scope — decided, and operative for nothing.
#
# THAT LAST ONE MATTERS AND IS ONLY LEGITIMATE HERE. No real target in this repository has a
# demonstrated target requirement: nothing has been load-tested, acceptance-tested or checked
# against a shipping manifest. The fixture carries one so the REFUSAL path — the one that says a
# Build may not have another value — has a test, without any real profile claiming it.
#
# It is NOT a target profile. It carries `synthetic = true`, its targets are `fixtureone-synthetic`,
# `fixturetwo-synthetic`, `fixturethree-synthetic` and `fixturefour-synthetic` (not catalog units),
# it lives outside
# `defs/adapters/`, and `tdb_canonical::asset_registry_population` EXCLUDES synthetic profiles.
# Exercising a representation therefore cannot inflate coverage by a single row.
#
# Its `family` must still be one of the fourteen tracked families, because the vocabulary is closed;
# `assets-arenas` is used so all three asset classes can be declared in one document.

schema = "asset-output-profile/3"
profile_version = 2
family = "assets-arenas"
synthetic = true
note = "Synthetic. No value here describes any real game, and no citation here names a real audit."

[[canonical_source]]
role = "arena-mesh"
class = "mesh"
interchange = "mesh-canonical"
retention = "unmodified"

[[canonical_source]]
role = "arena-texture"
class = "raster"
interchange = "rgba8"
retention = "unmodified"

[[canonical_source]]
role = "arena-audio"
class = "audio"
interchange = "pcm-s16"
retention = "unmodified"

