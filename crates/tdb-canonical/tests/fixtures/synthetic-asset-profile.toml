# =====================================================================================
# fixturefour-synthetic — C0-AS3-R1: per-variant containers, a provenance bridge, and a
# specimen observation that is established and still decides nothing.
# =====================================================================================

[[target_profile]]
target = "fixturefour-synthetic"
note = """
Three things no real profile in this repository can demonstrate.

FIRST, two forms of one family that do NOT share a container. The `loose` form is a bare texture on
disk; the `packed` form is a member of an archive. `[container]` is therefore stated per variant and
left unknown at target level, which is the other half of the rule fixturethree exercises: there the
one chain is shared and no variant restates it. Deciding it at both levels is refused, so a reader
never has to ask which level wins.

SECOND, a `[corpus.bridge]`. `fixture-four-extraction` is an extraction and is not attributable by
construction — but the extractor wrote a manifest naming the archive member each file came from, and
that manifest is a record which survived the extraction. With it, the extraction supports the
placement facts extracting normally discards. Without it, the same bytes support nothing of the sort.

THIRD, `[tiling]` established at `specimen-observation` scope, on the unattributable
`fixture-four-loose-specimens`. It is a true statement about four decoded files and it is NOT
operative: `AssetConstraint::operative` does not return it, no operation's requirement is satisfied
by it, and a Build that proposes another tiling is BLOCKED rather than checked against it. Recording
it beats discarding it — somebody measured those files — and recording it does not promote it.
"""

[[target_profile.corpus]]
id = "fixture-four-copy"
kind = "observed-installed-copy"
attribution = "attributable-to-target"
build_identification = "complete"
identity_source = "synthetic:fixture container header and build string"
inspected_files = 4096
groups = ["current"]
provenance = ["synthetic:fixture"]

[[target_profile.corpus]]
id = "fixture-four-extraction"
kind = "extracted-tree"
attribution = "not-attributable"
build_identification = "complete"
identity_source = "synthetic:fixture extraction manifest"
inspected_files = 2048
groups = ["current"]
limitations = ["An extraction: the tree itself is not something the title ships. What it carries here it carries through its bridge, not through its own standing."]
provenance = ["synthetic:fixture"]

[target_profile.corpus.bridge]
method = "archive-member-manifest"
original_corpus = "fixture-four-copy"
provenance = ["synthetic:fixture extraction manifest"]
note = "The manifest names the archive member every extracted file came from, so the placement the extraction would otherwise have discarded is recoverable. A bridge is that record — not a claim that one existed."

[[target_profile.corpus]]
id = "fixture-four-loose-specimens"
kind = "extracted-tree"
attribution = "not-attributable"
build_identification = "incomplete"
identity_source = "synthetic:fixture specimen list"
inspected_files = 4
groups = ["current"]
limitations = ["Four named files, kept as an example. No bridge, so nothing here reaches a placement fact or speaks for the target."]
provenance = ["synthetic:fixture"]

[[target_profile.path_family]]
id = "loose"
template = "loose/{numeric-id}.tex"
tokens = ["numeric-id"]
case = "lower"
bucket_resolution = "template-only"

[[target_profile.path_family]]
id = "packed"
template = "packed/{numeric-id}.tex"
tokens = ["numeric-id"]
case = "lower"
bucket_resolution = "template-only"

