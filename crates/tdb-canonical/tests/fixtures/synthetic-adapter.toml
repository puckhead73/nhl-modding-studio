# SYNTHETIC FIXTURE — NOT A TARGET PROFILE, NOT REGISTRY COVERAGE.
#
# Every value in this file is invented. It exists to exercise the `target-adapter/2` representations
# for which this repository establishes no real fact yet — a pooled string, a literal-code null
# sentinel, two's-complement and offset-binary signedness, a canonical-value predicate, a one-to-many
# companion, a metadata-declared foreign key, a capacity ceiling read from a main DB, and the
# `not-applicable` state — so that those representations are proven to work before a real target ever
# needs them.
#
# `synthetic = true` is load-bearing: `registry_population` excludes synthetic adapters, so nothing
# here can inflate coverage, and a test asserts no file under defs/adapters/ carries the flag. The
# `target` is `fixture-synthetic`, which is not a catalog unit and never will be.

schema = "target-adapter/2"
adapter_version = 2
canonical_schema_version = 1
target = "fixture-synthetic"
generation = "synthetic"
endian = "little"
synthetic = true

[[table]]
id = "SYN1"
name = "synthetic_primary"
provenance = ["crates/tdb-canonical/tests/fixtures/synthetic-adapter.toml (SYNTHETIC)"]

[[table]]
id = "SYN2"
name = "synthetic_companion"
provenance = ["crates/tdb-canonical/tests/fixtures/synthetic-adapter.toml (SYNTHETIC)"]

[[table]]
id = "SYN3"
name = "synthetic_parent"
provenance = ["crates/tdb-canonical/tests/fixtures/synthetic-adapter.toml (SYNTHETIC)"]

