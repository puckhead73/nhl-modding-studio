C0-POR1 argued the tree carries authentic content because 49 of 50 sampled ids decoded to block
streams identical to the PS3 copy. R1 WITHDRAWS that argument. The two decode chains share their
`BIGF`, RefPack and DXT5 stages, so the comparison exercises only the Xbox 360-specific stages
(`XPR2` header offsets, the 8-in-16 swap, the tiling formula); and agreement between two copies is
evidence about those specimens, not about whether either tree was modified. The comparison result is
kept — it is a useful check on the Xbox 360-specific stages — but it establishes nothing here.

The measurements below are extensive and exhaustive over the inspected tree. They are candidates
because of what the tree is, not because of how much was measured.
"""

