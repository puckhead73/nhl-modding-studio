`.options` file, which is not an archive and is excluded from every archive count). Identity from
the title's own XEX2 EXECUTION_INFO header — title id `454109EC`, media id `3CF2A23F`, executable
`nhlzf.exe` — matching the NHL Legacy Xbox 360 title id at crates/studio-domain/src/discovery.rs:48.

NOTHING IS ESTABLISHED ON THIS TARGET, and the reason is provenance rather than measurement: the
tree is DERIVED. It sits beside the title's own shipping archives (`boot.big`, `cache.big`,
`nocache.big`, `cacherender.big`, `data0.big`, ...) and a sibling `Extracted BIG Files\\` directory,
