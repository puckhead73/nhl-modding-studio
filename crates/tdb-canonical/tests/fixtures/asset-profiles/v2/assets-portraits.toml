[[target_profile.operation]]
operation = "identify"
requires = ["identity"]

[[target_profile.operation]]
operation = "preview"
requires = ["container", "raster", "dimensions", "tiling"]
note = "Decoding pixels needs the container chain, the pixel codec, the surface size and its memory layout."

[[target_profile.operation]]
operation = "export"
requires = ["container", "raster", "dimensions", "tiling", "mipmaps"]

[[target_profile.operation]]
operation = "replace"
requires = ["container", "raster", "dimensions", "tiling", "mipmaps", "compression", "atlas"]
