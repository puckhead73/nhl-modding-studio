# PRESERVED VERBATIM — the C0-POR1-R1 revision of defs/adapters/asset-profiles/assets-portraits.toml
# as it stood under `asset-output-profile/2`, kept only so the v2 -> v3 transition has a real
# document to be tested against rather than a hand-written stub. Nothing here is current: the live
# profile is the /3 one, and this copy is never loaded as a registry profile.
#
# Per-family asset output profile — player portraits (Q07a.1).
#
# A profile says how a canonical source asset becomes the bytes ONE target consumes. Canonical
# sources stay non-destructive and high fidelity; everything here is a derivation recipe, and a
# derived output is a reproducible artefact, never canonical Project data.
#
# Same evidence discipline as a database adapter (`target-adapter/2`): every block carries a state,
# a confidence and provenance; `unknown` BLOCKS rather than substituting; `not-applicable` must say
# how the absence was determined; a merely `asserted` claim is a non-operative CANDIDATE that
# nothing reads; and no profile can declare `game-verified` — the vocabulary has no such term.
#
# THIS FILE STATES FORMAT CONSTRAINTS ONLY. It carries no key in which a converter, a support level
# or an operation result could be recorded. `[[target_profile.operation]]` says which format facts
# an operation would need, NOT that Studio performs it. Implementation status lives in the evidence
# system.
#
# WHAT C0-AS1 CHANGED, AND WHY NOTHING WAS PROMOTED. The v1 revision of this file carried seven
# free-text strings and one target-wide `qualification = "implemented"` read off
# docs/audits/data/assets/nhllegacy/xbox360/capability.csv. That CSV is an OPERATIONS record — it
# says what Studio's ported pipeline did on an extracted tree, not what the shipped target format
# requires — so under the R1/R2 evidence rules it is an `asserted` source. Every fact derived from
# it is therefore a CANDIDATE here, not an established constraint. The v1 bytes are preserved
# verbatim at crates/tdb-canonical/tests/fixtures/asset-profiles/v1/assets-portraits.toml and the
# transition is exercised by `upgrade_asset_profile_v1`.
#
# WHAT C0-POR1 ADDED, AND WHAT C0-POR1-R1 THEN CORRECTED (2026-09-08). C0-POR1 read bytes from three
# supplied private copies and populated this file. Review found several of those promotions
# over-scoped, and R1 corrected them. Both records apply; R1 governs where they differ:
#   docs/receipts/c0-por1-portrait-measurements.md   (measurements, with an appended corrections log)
#   docs/receipts/c0-por1-r1-evidence-scope.md       (the correction, and the rules used below)
#
# THE THREE EVIDENCE LEVELS THIS FILE NOW DISTINGUISHES. Every note below says which one it means.
#   * SPECIMEN OBSERVATION — measured on named specimens only (a handful of files). Never on its own
#     grounds for a target-wide constraint.
#   * INSPECTED-CORPUS INVARIANT — holds for every file inspected in that target's supplied root,
#     across ALL groups (current and backup-labelled alike). Group-conditional properties are NOT
#     invariants: conditioning on a group means the group label is itself an inference.
#   * TARGET REQUIREMENT — what the shipped title requires. NOTHING here reaches this level: no
#     load test, no acceptance test and no shipping-manifest check was performed on any target.
#
# A block is `established` here only when it is an inspected-corpus invariant AND that corpus is
# attributable to the target. That is true for ONE of the three targets:
#
#   * nhllegacy-ps3   — the corpus is that title's own installed directory, identified from its own
#                       PARAM.SFO. THREE blocks qualify. Note the copy carries third-party writes
#                       (206 backup-labelled files, 206 current files with mip chains); the three
#                       promoted blocks hold across those too, which is why they survive.
#   * nhllegacy-xbox360 — the corpus is a derived `_compiled` tree. It is NOT attributable to the
#                       shipped title, so NOTHING is established. C0-POR1 argued authenticity from
#                       decoded-pixel agreement with the PS3 copy; that argument is WITHDRAWN (it
#                       shows the specimens agree, not that a tree is unmodified). Measurements are
#                       kept as candidates.
#   * nhl21-ps4       — the corpus is an extracted tree. Same position: nothing established.
#
# THREE BLOCKS STAY UNKNOWN ON EVERY TARGET, EACH FOR A STATED REASON:
#   * `dimensions` on both NHL Legacy targets. `DimensionsValue` holds ONE width/height, and the
#     corpus carries three co-existing sizes on one target — 512x512, 512x256 and 256x128 — with the
#     first two co-existing inside the SAME folder. `DimensionsValue.variant` documents itself as
#     "a target carrying several declares several profiles", but that mechanism is not reachable:
#     two `[[target_profile]]` entries for one target are refused by `Rule::DuplicateTargetProfile`,
#     and a profile file is keyed one-per-family by its filename. The required semantics are listed
#     in the R1 receipt for a later package; NO schema change is made here.
#   * `path_rule` everywhere. The bucket directory is not derivable from the observed data: C0-POR1
#     asserted an id-to-bucket rule it never identified or tested, and R1 withdrew that. Only bucket
#     MEMBERSHIP was observed. A second gap stands regardless: one target carries two portrait path
#     families (`playerheads`, `playerheadssmall`) that one value cannot hold.
#   * `raster` everywhere. `RasterValue` bundles {codec, color_space, channels, alpha} into ONE
#     value. `color_space` is absent from the `DDS` and `XPR2` headers and is NOT uniform on PS4
#     (num_format 0 on 10 246 files, 9 on 175). C0-POR1 filled it with a guess; R1 removed the
#     candidate rather than fabricate a bundled field. The measurements live in the manifest at
#     docs/receipts/data/c0-por1-census.json.
#
# COVERAGE. One family, three target profiles, three established constraints — all on one target.
# Every other (family, target) pair is UNMAPPED — see
# docs/validation/c0-06-canonical-project-and-adapters.md.

schema = "asset-output-profile/2"
profile_version = 2
family = "assets-portraits"
note = """
Three constraints are established, all on `nhllegacy-ps3`, all inspected-corpus invariants over that
title's own installed copy. Nothing on any target reaches the level of a demonstrated target
requirement: no load, acceptance or shipping-manifest test was performed anywhere. The Xbox 360 and
PS4 measurements are extensive but sit on trees that are not attributable to their shipped titles,
so they are candidates.
"""

[[canonical_source]]
role = "portrait"
class = "raster"
interchange = "rgba8"
# Q14: portrait library inputs arrive already normalized to a consistent composition/background
# state, and Studio must not recrop, reframe, remove backgrounds or apply style treatment. The
# target adapter scales and encodes; it does not compose.
retention = "normalized-input"
description = "A lossless RGBA source image at the highest available resolution, retained unmodified by Studio."

# =================================================================== NHL Legacy, PS3

[[target_profile]]
target = "nhllegacy-ps3"
note = """
Corpus: the `fe/ion/artassets/playerheads` and `playerheadssmall` folders of an OBSERVED INSTALLED
COPY of this title (RPCS3 `dev_hdd0/game/BLUS31540`; identity from that copy's own PARAM.SFO, and the
title id matches the one already recorded at crates/studio-domain/src/discovery.rs:48). 18 663 files,
all accepted by the C0-POR1 inspection parser.

WHAT "OBSERVED INSTALLED COPY" DOES AND DOES NOT MEAN. It is this title's own directory layout, which
is why it is the only target here with anything established. It is NOT established to be a pristine
or complete shipping layout: the copy carries third-party writes (206 backup-labelled `.bak` files
and 206 current files carrying mip chains where the rest carry none), no shipping manifest was
checked, and `patch.big` — present at USRDIR root — was not examined at all.

NEITHER `.bak` NOR `mipMapCount = 0` ESTABLISHES PROVENANCE. C0-POR1 labelled these groups "vanilla"
and "modified"; that was an inference presented as a measurement, and it was circular for mipmaps
(the group was defined by mip count, then the group's mip count was reported as a finding). Groups
are named neutrally here and throughout: `current` / `backup-labelled`, `base-level-only headers` /
`mip-chain headers`.

Exact per-group counts are in docs/receipts/data/c0-por1-census.json.
"""

[target_profile.discovery]
state = "unknown"
note = """
SPECIMEN/CORPUS OBSERVATION, not a discovery rule. Every portrait file in this copy is a loose file
under `fe/ion/artassets/<folder>/<bucket>/`. What is missing is any evidence that this is where the
GAME loads them from: no load test was run, and `patch.big` at USRDIR root — which could shadow or
supersede loose files — was never opened. C0-POR1 established this block on placement alone; R1
withdrew that.
"""

[target_profile.discovery.candidate]
confidence = "measured"
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/c0-por1-r1-evidence-scope.md",
]
note = "Observed placement in one installed copy, offered as a proposal. Promoting it needs evidence about what the game actually loads, including the role of `patch.big`."

[target_profile.discovery.candidate.value]
scope = "loose-tree"
root = "fe/ion/artassets"
recursive = true

[target_profile.identity]
state = "unknown"
note = """
INSPECTED-CORPUS INVARIANT for the filename shape only: all 18 663 files match `p{digits}.big` or
`p{digits}.big.bak`, zero exceptions. Two things block the block itself. The binding of that number
to a database field (`ubPc.lOnr` is used for this elsewhere in the application) was never examined.
And `IdentityValue` also requires `ambiguity`, which is a Studio behaviour choice rather than
anything measurable here — C0-POR1 filled it with `reject`; R1 removed the candidate rather than
carry a fabricated field in a bundled value.
"""

[target_profile.container]
state = "established"
confidence = "measured"
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/c0-por1-r1-evidence-scope.md",
    "docs/receipts/data/c0-por1-census.json",
]
derivation = """
INSPECTED-CORPUS INVARIANT. All 18 663 files in this copy — current and backup-labelled alike —
parse as a `BIGF` archive with exactly 6 members in the member-name pattern
`0, <num>, sg1, <num>, sg2, 1`, and in every one of them exactly one member is a RefPack stream whose
decompressed head begins `DDS `. Zero exceptions in either group. The invariance across BOTH groups
is what makes this survive the provenance caveat: it holds for the third-party-written files too.

Header layout, read from bytes: `BIGF` at 0x00; a u32 at 0x04 equal to filesize minus 16 that is
LITTLE-endian while the member count, header size and every member offset/length are BIG-endian;
members 64-byte aligned. The 6-member order and the 64-byte alignment are independently corroborated
by a leftover EA packaging command line found in the Xbox 360 tree (`-align64`, and the same member
order under a `_textures` group) — a non-pixel corroboration, unrelated to the withdrawn
decoded-pixel argument.

The RefPack layer sits between these two and is recorded under [compression], following this file's
existing convention that a payload compression is not a container layer.

NOT a target requirement: nothing here shows the game REJECTS another container. No load test was
run. "Accepted by the inspection parser" means the C0-POR1 parser found the fields it looks for at
the offsets it expects — not semantic validation.
"""

[[target_profile.container.value.layer]]
format = "bigf"
index = "name-table"
note = "Six members in a fixed name pattern; exactly one carries the texture. The other members carry the Scaleform APT resource, not pixels."

[[target_profile.container.value.layer]]
format = "dds"
index = "none"
note = "A 124-byte `DDS ` header on every file inspected."

[target_profile.path_rule]
state = "unknown"
note = """
Two independent blockers.

(1) THE BUCKET RULE WAS NEVER IDENTIFIED. Only membership was observed:
      p0_4000       ids 1-3999          p8001_12000  ids 8003-12401
      p4001_8000    ids 4001-7998       silhouettes  ids 60000-60003
    C0-POR1 wrote that the rule "is NOT the literal folder-name ranges" and treated that as a
    finding. R1 withdraws it: no candidate id-to-bucket function was formulated and none was tested,
    so what is actually known is the membership above and nothing more. The `p8001_12000` upper
    bound simply does not match its folder name, which is an observation, not a rule.

(2) One target carries TWO portrait path families (`playerheads`, `playerheadssmall`) and a single
    `PathRuleValue` cannot hold both. This blocks the block regardless of (1).

Required semantics for a schema revision are listed in the R1 receipt; nothing is changed here.
"""

[target_profile.raster]
state = "unknown"
note = """
`RasterValue` bundles {codec, color_space, channels, alpha} into one value, and the bundle cannot be
completed honestly:

  codec        INSPECTED-CORPUS INVARIANT — `ddspf.dwFourCC` is `DXT5` on all 18 663 files.
  channels     Follows from the codec.
  alpha        SPECIMEN OBSERVATION ONLY — three specimens (playerheads p1008 and p1, playerheadssmall
               p1008) were decoded with the C0-POR1 DXT5 decoder and carry texels whose colour
               channels exceed alpha, which is inconsistent with premultiplication. That is three
               files, by one decoder, in one folder pair. C0-POR1 promoted it to a target-wide
               `straight`; R1 scopes it back to the specimens.
  color_space  NOT MEASURED AT ALL — the `DDS` header does not record one.

C0-POR1 filled `color_space` with a guessed `srgb` inside a candidate. R1 removed the candidate:
filling a bundled unknown to make a value well-formed is fabrication, and a candidate is supposed to
be a proposal, not a hole with a plug in it. The measurements are preserved in
docs/receipts/data/c0-por1-census.json instead.
"""

[target_profile.dimensions]
state = "unknown"
note = """
Not for want of measurement — every file was measured. Observed distribution in this copy:

  playerheads       512x512   6465 current + 102 backup-labelled
  playerheads       512x256   2660 current +   1 backup-labelled
  playerheadssmall  256x128   9126 current + 103 backup-labelled
  (plus 206 current files carrying mip chains at those same base dimensions)

`DimensionsValue` holds one width/height, and the first two co-exist inside the same folder so they
cannot be split by path either. The `variant` field's documented escape ("a target carrying several
declares several profiles") is not reachable — see the file header. Q10 makes this load-bearing: a
release replacement must preserve original dimensions, so `replace` stays blocked here.
"""

[target_profile.mipmaps]
state = "unknown"
note = """
WITHDRAWN BY R1, and the reason matters. C0-POR1 established `policy = "none"` by measuring the
subset it had already labelled "vanilla" — a subset DEFINED by carrying no mip chain. That is
circular, and the underlying corpus is not invariant: of 18 457 current files, 206 carry mip chains
(mip counts 9, 10 and 1) and the rest carry none. A property that holds only within a group defined
by that property is not an inspected-corpus invariant.

Separating EA-authored from third-party-authored files would need provenance evidence this package
does not have. The full per-group counts are in docs/receipts/data/c0-por1-census.json.
"""

[target_profile.compression]
state = "established"
confidence = "measured"
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/c0-por1-r1-evidence-scope.md",
    "docs/receipts/data/c0-por1-census.json",
]
derivation = """
INSPECTED-CORPUS INVARIANT. The texture member of all 18 663 files — both groups — begins with the
RefPack magic `10 FB` followed by a 3-byte big-endian decompressed size, and decompresses far enough
to yield a valid `DDS ` header. On the named specimens the full stream was decompressed and its
output length equalled the declared size exactly. As with [container], the invariance across the
third-party-written files as well is what lets this survive the provenance caveat.

`deterministic` is false because it was NOT tested: nothing here establishes that any encoder
reproduces EA's exact RefPack bytes for unchanged input.

NOT a target requirement: no load test shows the game rejects an uncompressed member.
"""

[target_profile.compression.value]
payload = "refpack"
deterministic = false

[target_profile.tiling]
state = "unknown"
note = """
Demoted by R1 from `linear`. What is an inspected-corpus invariant is that the texture container is
`DDS ` on every file — already carried by [container]. That the pixel data is genuinely LINEAR rests
on three specimen decodes (a DDS file can carry console-swizzled payloads, so the container does not
settle it). Three specimens do not support a target-wide constraint.
"""

[target_profile.tiling.candidate]
confidence = "measured"
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/c0-por1-r1-evidence-scope.md",
]
note = "Three specimens decoded to coherent portrait images with no deswizzle applied. A specimen observation offered as a proposal, not a corpus invariant."

[target_profile.tiling.candidate.value]
kind = "linear"

[target_profile.atlas]
state = "established"
confidence = "measured"
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/c0-por1-r1-evidence-scope.md",
    "docs/receipts/data/c0-por1-census.json",
]
derivation = """
INSPECTED-CORPUS INVARIANT. Exactly one texture payload was found in each of the 18 663 files — the
census counts texture members per archive and the count is 1 everywhere, in both groups, with no
archive carrying two. Since each numeric id has its own archive with its own texture, no surface is
shared between ids, which is what `none` asserts here.

Scope limit kept deliberately: this says portraits do not share a page BETWEEN archives. Whether a
single surface ever packs more than one portrait image is a per-image question answered only for the
decoded specimens, each of which showed a single portrait.
"""

[target_profile.atlas.value]
kind = "none"

[target_profile.install]
state = "unknown"
note = """
Nothing was tested. No file was written, no replacement was installed and no runtime was launched
anywhere in C0-POR1 or R1. Placement is not proof of required install behaviour, and `patch.big` was
not examined.
"""

[[target_profile.operation]]
operation = "discover"
requires = ["discovery"]

[[target_profile.operation]]
operation = "identify"
requires = ["identity"]

[[target_profile.operation]]
operation = "preview"
requires = ["container", "raster", "dimensions", "tiling"]
note = "Decoding pixels needs the container chain, the pixel codec, the surface size and its memory layout."

[[target_profile.operation]]
operation = "export"
requires = ["container", "raster", "dimensions", "tiling", "mipmaps"]

[[target_profile.operation]]
operation = "replace"
requires = ["container", "raster", "dimensions", "tiling", "mipmaps", "compression", "atlas"]
note = "Q10 requires a release replacement to preserve the original dimensions and encoded format, so both are prerequisites rather than outputs."

[[target_profile.operation]]
operation = "install"
requires = ["container", "install"]

