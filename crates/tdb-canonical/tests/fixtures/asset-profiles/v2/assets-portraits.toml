operation = "install"
requires = ["container", "install"]

# ===================================================================== NHL 21, PS4

[[target_profile]]
target = "nhl21-ps4"
note = """
Corpus: 10 421 `.gnf` files, all accepted by the inspection parser, all exactly 180 480 bytes.
Identity MEASURED from the copy's own `sce_sys/param.sfo` — TITLE `NHL 21`, TITLE_ID `CUSA18182`,
CONTENT_ID `EP0006-CUSA18182_00-NHLICEHOCKEY2021` — so `nhl21-ps4` is correctly addressed. Nothing
about this target was inherited from, or inferred from, the two NHL Legacy copies.

NOTHING IS ESTABLISHED, for the same provenance reason as Xbox 360: the supplied path is literally
`databigs\\Extracted\\...`. An extracted tree establishes nothing about the outer `.big` packaging,
about where a shipped portrait lives, or about install behaviour.

TWO FURTHER LIMITS, both narrowing what the measurements can mean:
  * NO PS4 PIXEL DATA WAS DECODED. Every geometry and format value below is an INTERPRETATION of T#
    descriptor bitfields. `data_format 41` is BC7 by the GCN table — a documented lookup, not a
    decode — and `tiling_index 13` was never exercised.
  * C0-POR1 claimed the payload's 384 all-zero blocks "independently confirm" a 340-pixel logical
    height, and that a linear surface could carry no padding. R1 withdraws both. All-zero blocks are
    CONSISTENT with padding rows but have other explanations (a blank image region encodes the same
    way), and linear surfaces can be pitch-padded too. The arithmetic
    (180 480 - 256 = 180 224 = 128 x 88 x 16) is consistent with a 512x352 padded surface; it does
    not by itself establish the logical height, which is read from the descriptor.
"""

[target_profile.discovery]
state = "unknown"
note = "The tree is an extraction; where these files live in the shipped title was not examined."

[target_profile.identity]
state = "unknown"
note = "All 10 421 filenames match `p{digits}.gnf` with zero exceptions, but the binding to a database field was never examined and `ambiguity` is not measurable here."

[target_profile.container]
state = "unknown"
note = "The `GNF ` layer is known NOT to be the whole chain — these files came out of `.big` containers, so at least one outer layer exists and was not examined."

[target_profile.container.candidate]
confidence = "measured"
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/data/c0-por1-census.json",
]
note = "Innermost observed layer only, invariant across all 10 421 files: `GNF ` magic, `contentsSize = 0xF8`, version 2, a GNM T# descriptor at 0x10, payload at 0x100."

[[target_profile.container.candidate.value.layer]]
format = "gnf"
index = "none"
note = "One GNM 2D texture per file. At least one outer archive layer exists and was not measured."

[target_profile.path_rule]
state = "unknown"
note = "A path observed inside an extraction is not a path rule for the shipped title."

[target_profile.raster]
state = "unknown"
note = """
Blocked three ways. `data_format 41` maps to BC7 by a table lookup, not a decode. `color_space` IS
recorded on this target and is NOT uniform — the num_format field reads 0 on 10 246 files and 9 on
175 — so no single target-wide value is correct even in principle. And `alpha` was never measured on
this target at all. C0-POR1 recorded a candidate that filled both `color_space` and `alpha`; R1
removed it. The per-group counts are in docs/receipts/data/c0-por1-census.json.
"""

[target_profile.dimensions]
state = "unknown"
note = "Provenance: the corpus is an extracted tree. Unlike the two Gen7 targets this property is uniform across the whole inspected corpus, so a candidate is recorded."

[target_profile.dimensions.candidate]
confidence = "measured"
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/c0-por1-r1-evidence-scope.md",
    "docs/receipts/data/c0-por1-census.json",
]
note = """
Uniform across all 10 421 files, and the only portrait dimension in this family that a single value
can express. Read as an interpretation of the T# descriptor (`width-1 = dword2 & 0x3FFF`,
`height-1 = (dword2 >> 14) & 0x3FFF`); every file is also exactly 180 480 bytes, which is consistent
with a 512x352 padded BC7 surface plus a 256-byte header. The padding arithmetic is consistent with
340 logical rows; it is not independent confirmation of them, and R1 withdrew C0-POR1's claim that it
was.

`variant` carries no measurement — it is a label naming this family's single observed portrait form.
`power_of_two = false` records that 340 is not a power of two.
"""

[target_profile.dimensions.candidate.value]
width = 512
height = 340
variant = "portrait"
power_of_two = false

[target_profile.mipmaps]
state = "unknown"
note = "Provenance, not measurement."

[target_profile.mipmaps.candidate]
confidence = "measured"
provenance = ["docs/receipts/data/c0-por1-census.json"]
note = "`last_level = 0` in the T# descriptor on all 10 421 files — an interpretation of a header field. The payload arithmetic leaves no room for a chain, being exactly the padded base level."

[target_profile.mipmaps.candidate.value]
policy = "none"

[target_profile.compression]
state = "unknown"
note = """
NOT MEASURABLE from this corpus, which is a different position from the other blocks here. The files
were read from an extraction and are stored decompressed there, so whatever payload codec the
shipping archive applies is simply not observable. This is an absence of evidence, not a measurement
of `none`, and no candidate is recorded.
"""

[target_profile.tiling]
state = "unknown"
note = "Provenance, and the layout was never exercised — see the candidate note."

[target_profile.tiling.candidate]
confidence = "measured"
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/c0-por1-r1-evidence-scope.md",
]
note = """
`tiling_index = 13` on all 10 421 files — an interpretation of a T# bitfield, and the ONLY evidence
for this block. No PS4 pixel data was decoded, so the layout that index names was never exercised and
nothing here shows it reproduces these images.

C0-POR1 additionally argued from the payload padding that the surface must be tiled because a linear
surface would carry none. R1 withdraws that: linear surfaces can be pitch-padded, so the padding is
consistent with tiling but does not imply it. `alignment_bytes` is omitted rather than guessed.
"""

[target_profile.tiling.candidate.value]
kind = "gnf-tiled"

[target_profile.atlas]
state = "unknown"
note = "Provenance, not measurement."

[target_profile.atlas.candidate]
confidence = "measured"
provenance = ["docs/receipts/data/c0-por1-census.json"]
note = "One GNM 2D texture per file across all 10 421 files; no surface is shared between ids."

[target_profile.atlas.candidate.value]
kind = "none"

[target_profile.install]
state = "unknown"
note = "An extracted tree establishes nothing about install behaviour or about the outer `.big` packaging a replacement would have to satisfy. Nothing was installed or tested."

