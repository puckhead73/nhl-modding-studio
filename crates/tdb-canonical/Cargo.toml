[package]
name = "tdb-canonical"
description = "Canonical Project schema, versioned target-adapter contract and asset output profiles (Q07a.1) — types plus the validator that enforces the contract's rules."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# The approval fingerprint and the profile content digest are SHA-256 over a canonical encoding
# defined in `build_override.rs`. Already vendored for `tdb-qa`, so no new third-party surface
# enters the repository; the crate otherwise stays serde+toml and reads no game data.
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
# Test-only, so the shipping crate stays serde+toml. It exists for ONE assertion: that this crate's
# `ASSET_FAMILY` vocabulary still equals the QA matrix's family axis, so a profile can never
# register itself against a coverage key the ledger does not have.
tdb-qa = { path = "../tdb-qa" }
# Test-only as well (package C0-REG1a-R1). The Legacy capacity and semantic cases read the
# committed Xbox 360 Legacy ROSTER fixture through the production save codec and the TDB parser,
# so that a capacity is read from the save it is attributed to, not inferred from a neighbour.
tdb-core = { path = "../tdb-core" }
tdb-savedata = { path = "../tdb-savedata" }
