[package]
name = "studio-domain"
description = "NHL Modding Studio — GUI-agnostic edit/session orchestration over the TDB engine."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tdb-core = { path = "../tdb-core" }
tdb-defs = { path = "../tdb-defs" }
tdb-enums = { path = "../tdb-enums" }
tdb-relations = { path = "../tdb-relations" }
tdb-domain-validation = { path = "../tdb-domain-validation" }
tdb-edit = { path = "../tdb-edit" }
tdb-savedata = { path = "../tdb-savedata" }
tdb-archive-big = { path = "../tdb-archive-big" }
tdb-archive-codec = { path = "../tdb-archive-codec" }
tdb-rx2 = { path = "../tdb-rx2" }
tdb-fhm = { path = "../tdb-fhm" }
tdb-fhm-store = { path = "../tdb-fhm-store" }
tdb-formula = { path = "../tdb-formula" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Curated appearance defs (the orphan/retired head-id → name table) are TOML.
toml = "0.8"
# Portrait/texture export only needs PNG encoding — the DDS side is ours.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Synthetic in-memory FHM corpus for the Roster Builder orchestration tests (bundled SQLite is
# already compiled for `tdb-fhm-store`, so this adds no new native build).
rusqlite = { version = "0.31", features = ["bundled"] }
