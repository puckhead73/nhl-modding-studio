# Title-scoped nationality labels: NHL 07 (gen6 schema; developer receipt 28, 26 Sep 2026).
#
# NHL 07 has its own country table. Studio already displays it through `attributes::GEN6_COUNTRIES`
# (every code confirmed in game by the user or fixed by a well-known player's documented nationality or
# birthplace); this file is the same table for the registry, so the label lookup used by the import
# resolves NHL 07's codes instead of NHL Legacy's (before this file an imported Czech player would have
# been written 82, which NHL 07 labels Germany). Code 78 (Belgium) is inferred in that table and is left
# out here, so the import never writes it; the display keeps the existing table unchanged.
#
# Research note (R120, 26 Sep 2026): NHL 07 has no national-team rosters, so R120b has no NHL 07 row;
# the 13 national-team codes it measured on NHL 08 / 09 are identical to the codes below.

name = "Nationality"
confidence = "Confirmed"
notes = """
NHL 07 gen6 country codes; mirror of studio-domain attributes::GEN6_COUNTRIES without the inferred 78.
"""

[source]
kind = "operator-research"
description = "NHL 07 roster, confirmed in game by the user or by documented players (the NHL 07 country table)"

[scope]
games = ["nhl07"]

[[bindings]]
field_name = "Nationality"
field_raw_id = "Lelh"
table_raw_id = "ubPc"

