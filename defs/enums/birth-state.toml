# Confirmed enum: Birth State (player birthplace state/province/country
# on player bio rows).
#
# Operator-confirmed anchors:
#
#   - Task #38 (A.J. Gale): `ubPc.QvxI = 2` → "Canada, British Columbia"
#   - Task #39 (Aaron Palushaj, Livonia): `QvxI = 37` → "USA, Michigan"
#   - Task #39 (Aaron Ness, Roseau): `QvxI = 38` → "USA, Minnesota"
#
# Combined with the Task #35 anchors (Mike Green / Zajac / Letang /
# Yandle / Thompson / Shannon / Kessel / Stastny etc.), these
# establish the encoding:
#
#   QvxI  1..13 → Canada provinces & territories, **alphabetical**
#                 (Alberta, BC, Manitoba, NB, NL, NT, NS, NU, ON,
#                 PEI, QC, SK, YT).
#   QvxI  15..65 → USA states + DC, **alphabetical** (Alabama through
#                  Wyoming, with District of Columbia inserted
#                  between Delaware and Florida).
#   QvxI 66+    → Non-NA country fallback codes that mirror Lelh
#                 (e.g. 67 = Finland, 76 = Russia, 82 = Czech,
#                 74 = Latvia). These are NOT alphabetical; each
#                 needs its own anchor.
#
# The dropdown labels are taken verbatim from the NHLViewNG
# `nhlviewng_unpacked.exe` UTF-16 string table (extracted via
# `tmp/extract_strings.py`). The one quirk: the EXE itself
# misspells Connecticut as "USA, Connectcut" — we ship the correct
# spelling here because the value `21` is identified by the Shannon
# anchor and the on-disk EXE typo would be confusing to the user.
#
# Population validation across `default.db`'s 5632 populated ubPc
# rows (skater + goalie pool):
#
#   ON 856 · QC 443 · AB 347 · BC 319 · SK 195 · MB 113 · NS 63
#   NB 30 · NL 22 · PE 18 · NT/NU/YT 0  — matches NHL representation.
#   MI 109 · MN 106 · NY 71 · MA 58 · IL 48 · CA 40 · PA 34 · WI 27
#   CT 26 · CO 22 · NJ 21 · AK 16 · MO 15 · OH 15 · FL 13 · TX 13
#   WA 9 · ND 8 · AZ 7 · IN 7 · ME 6 · NH 4 · NC 4 · VA 4 · etc.
#
# Codes with 0 anchor players in this DB (NT/NU/YT, some sparsely
# populated US states) are still shipped so a future re-rostered DB
# with those codes resolves cleanly.
#
# Bit width on disk: `QvxI` is 7-bit, so reachable codes are 0..127.
# 2026-05-29: the operator cross-referenced the remaining populated codes
# against NHLViewNG (enum_audit List B). `QvxI == 0` = "Canada" and
# `QvxI == 14` = "USA" — the bare country codes for a player with no
# specific province/state (they sit just outside the alphabetical
# province/state ranges, not sentinels as previously assumed). The 66+
# non-NA country fallbacks confirmed to mirror Lelh exactly, plus a few
# exotic birthplaces (94=Serbia, 101=Brunei, 112=Nigeria, 116=Singapore,
# 117=South Africa). All promoted below.

name = "Birth State"
confidence = "Confirmed"
notes = """
Player birthplace state/province/country code on the player bio
table. NHLViewNG XML labels the field "State" but the editor's
"Personal Data" tab shows it as a combined "Country, State/Province"
dropdown. The 13 Canada-province + 51 USA-state slots are
alphabetical (with DC inserted between Delaware and Florida);
non-NA country codes are non-contiguous and need per-country
anchors. Labels are sourced verbatim from `nhlviewng_unpacked.exe`'s
UTF-16 string table (the operator's research corpus), with the EXE's
"Connectcut" typo corrected here.
"""

[source]
