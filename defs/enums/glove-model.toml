# Confirmed enum: Glove Model (xmja.NmUR on skater equipment rows).
#
# Sourced from the operator's equipment-ID catalog CSV
# (Data/Equipment/glove.csv). NHLViewNG's field registry labels
# xmja.NmUR as "Gloves". Crosby anchor: NmUR=68 → "CCM Tacks Ultra".
#
# Several IDs in the CSV share an identical model string (operator
# "?" placeholders where the brand/model isn't yet identified, plus
# the EA-Sports paint variants that ship as consecutive-ID pairs).
# The loader rejects duplicate labels, so each member of a shared
# label group carries a `(#<id>)` disambiguator — same convention as
# `stick-model.toml`. Disambiguated groups:
#   Reebok ?                    → 18 / 25 / 49
#   CCM ?                       → 20 / 41
#   Easton EQ Pro               → 21 / 45
#   Warrior ?                   → 44 / 52
#   Bauer Supreme (EA Sports)   → 70 / 71
#   CCM CL 500 (EA Sports)      → 72 / 73
#   Easton Mako (EA Sports)     → 74 / 75
#   EA Sports                   → 76 / 77
#   Warrior Covert (EA Sports)  → 100 / 101

name = "Glove Model"
confidence = "Confirmed"
notes = """
Skater glove model asset id on xmja.NmUR (7-bit; 128-slot field). The
54 IDs below are the catalogued glove models; raws not listed have no
catalog entry and surface as `raw N / uncatalogued` in the editor.
"""

[source]
kind = "operator-research"
description = "Equipment ID catalog CSV (NHL Legacy Edition Modding Tools, Data/Equipment/glove.csv, 2026)"

[[bindings]]
