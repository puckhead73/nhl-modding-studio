# raw 1 = AHL. Mapping sourced from the prior app's career-stats research
# (its display layer rendered exactly this vocabulary); consistent with the
# anchor data (NHL rows dominate; AHL rows appear for players with minor-league
# seasons). Not yet round-tripped in-game — treat as Reported, not Confirmed.

