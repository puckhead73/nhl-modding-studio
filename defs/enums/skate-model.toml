# Confirmed enum: Skate Model (xmja.AOOe on skater equipment rows).
#
# Sourced from the operator's equipment-ID catalog CSV
# (Data/Equipment/skate.csv). NHLViewNG's field registry labels
# xmja.AOOe as "Skates". Crosby anchor: AOOe=44 → "CCM Ribcore 50K Pump".
#
# Note: NHLViewNG's stick-change cascade *shifts* AOOe (see the
# SkaterEquipmentNotice banner / stick-model.toml editing recipe), so a
# stick swap can move this value off its catalogued ID. Duplicate-label
# groups carry a `(#<id>)` disambiguator (loader rejects duplicate
# labels):
#   Easton Mako             → 37 / 45
#   Bauer APX2 (EA Sports)  → 70 / 71
#   CCM RBZ (EA Sports)     → 72 / 73
#   Easton Mako (EA Sports) → 74 / 75

name = "Skate Model"
confidence = "Confirmed"
notes = """
Skater skate model asset id on xmja.AOOe (7-bit; 128-slot field). 31
IDs catalogued below (ID 8 is the generic goalie skate). Raws not
listed surface as `raw N / uncatalogued` in the editor.
"""

