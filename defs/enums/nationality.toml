# Confirmed enum: Nationality (player citizenship code on player bio rows).
#
# The raw 7-bit ubPc.Lelh field stores the player's nationality.
#
# Origin: Task #35's 22-player audit confirmed the first six entries
# (Canada/USA/Finland/Latvia/Russia/Czech Republic). 2026-05-29: the
# enum_audit cross-reference workflow (see docs/nhlviewng-enum-vocabulary.md
# + docs/enum-audit-nhlng-legacy.md) surfaced the remaining populated
# codes with example players, and the operator confirmed each against the
# NHLViewNG editor — they are now promoted below.
#
# Note the early population-histogram guesses were partly wrong: the
# confirmed encoding is 85=Germany, 95=Slovakia, 97=Switzerland, and
# 127 is the "-- N/A --" fallback sentinel. Any code still absent here
# (rare/unobserved) renders as a raw integer until operator-confirmed.

name = "Nationality"
confidence = "Confirmed"
notes = """
Player nationality code on the player bio table. NHLViewNG XML labels
the field "Nationality". The first six values are Task #35 anchor matches
(22/22 across NHL Legacy default.db); the rest were confirmed 2026-05-29
via the enum_audit cross-reference against NHLViewNG. Codes still absent
render as `Country #${raw}` until operator-confirmed.

Anchor population (default.db, 5632 populated rows):
  Lelh=0  → 2428 players (Canada)
  Lelh=14 →  718 players (USA)
  Lelh=67 →  434 players (Finland)
  Lelh=74 →   23 players (Latvia)
  Lelh=76 →   87 players (Russia)
  Lelh=82 →  443 players (Czech Republic)
"""

[source]
kind = "operator-research"
description = "Task #35 anchor-set audit (NHL Legacy default.db, 2026)"

