# Confirmed enum: Stick Model (xmja.wXFx on skater equipment rows).
#
# Catalog history:
#   - Task #61 (2026-05-xx): 4 sticks initially anchored via
#     single-attribute equip.db diff. **Three of those four labels
#     were superseded on 2026-05-18 when the operator identified each
#     wXFx ID from its `texlib_N.rpsgl` painted texture** — see
#     `playerstick/texlib_*.rpsgl` for the source artwork. The label
#     for ID 112 changed from "Bauer Nexus 1N" (NHLViewNG screenshot
#     anchor) to "CCM Ribcore 40K" (texture anchor); IDs 94, 97, 111
#     gained more specific model suffixes.
#
#   - 2026-05-18 orphan-stick test (the renderability proof): wrote
#     55 distinct orphan IDs to USRDIR/db/nhlng.db + zeroed the
#     cascade (NISO/jmjk/MMuu/FCNk) on each player. Confirmed every
#     orphan ID renders a distinct stick on-ice.
#
#   - 2026-05-18 texture-based catalog (this file's main expansion):
#     operator opened every `texlib_N.rpsgl` in the Texture Lab,
#     read the painted brand+model directly off the artwork. 74 IDs
#     identified; 5 pairs share a name (consecutive-ID paint variants
#     of the same model, disambiguated below with `(#N)` suffixes).
#
# Whitelist origin: `USRDIR/fe/ion/artassets/createplayer/sticks/`
# contains 106 `stick{N}.big` UI thumbnails (IDs 1-9, 12-13, 15-79,
# 81-95, 98-112). The texture pool at `USRDIR/rendering/playerstick/
# texlib_{N}.rpsgl` covers 74 of those — the IDs enumerated below.
# The other 32 createplayer IDs (1-9, 12-13, 15-17, 19-23, 27-29,
# 42-44, 57-59, 61-62, 66, 69, 76, 80) have no texlib and fall back
# to vanilla on-ice even with a cascade-reset assignment.
#
# Editing recipe (for assigning a stick to a specific player):
#   1. Set xmja.wXFx = <new ID>
#   2. Set NISO = 0, jmjk = 0, MMuu = 0, FCNk = 0 (cascade reset)
#   3. Write to USRDIR/db/nhlng.db (NOT the repo's default.db — that
#      file is never loaded by the running game)
#   4. Cold-restart NHL Legacy.
#
# In-game create-player UI is a separate, narrower whitelist (~23
# entries the operator can pick from the dropdown). Expanding that
# in-game dropdown is gated by an unidentified filter outside the
# database — future work.

name = "Stick Model"
confidence = "Confirmed"
notes = """
Skater stick model asset id on xmja.wXFx (7-bit; 128-slot field, but
only 74 IDs have rendering assets in `rendering/playerstick/texlib_N.rpsgl`).

All 74 IDs render distinctly on-ice when paired with a cascade reset
(NISO=0, jmjk=0, MMuu=0, FCNk=0) — verified by the 2026-05-18 orphan-stick
test against USRDIR/db/nhlng.db.

All 74 brand-identified via Texture-Lab inspection of the painted
artwork on each `texlib_N.rpsgl` (2026-05-18). 5 ID pairs share the
same brand+model and are disambiguated with `(#N)` suffixes — these
are paint-variant siblings of the same stick model:
   64 / 112  → CCM Ribcore 40K
   70 /  71  → Bauer Vapor APX2 (EA Sports)
   72 /  73  → CCM RBZ Stage 2 (White)
   74 /  75  → Easton V9E (Black)
  100 / 101  → WARRIOR Covert DT3 LT Grip

Three Task #61 anchors were refined or corrected by the texture pass:
  -  94: "Busch HPC 2.0" (Task #61) → "Busch hpc" (texture spelling)
  -  97: "STX Surgeon" (Task #61, model unspecified) → "STX Surgeon 500"
  - 111: "Bauer Supreme 1S" (Task #61) → "Bauer Supreme 1S MPK"
  - 112: "Bauer Nexus 1N" (Task #61, NHLViewNG anchor) → "CCM Ribcore 40K"
         (texture anchor — supersedes; Bauer Nexus 1N is actually ID 108)
"""

[source]
kind = "operator-research"
