# Confirmed enum: Helmet Model (xmja.YUZp on skater equipment rows).
#
# Sourced from the operator's equipment-ID catalog CSV
# (Data/Equipment/helmet.csv). NHLViewNG's field registry labels
# xmja.YUZp as "Helmet". Crosby anchor: YUZp=23 → "CCM Fitlite".
#
# The "(Visor Rendering Broken)" suffixes are the operator's note that
# those helmet IDs render the visor incorrectly in-game — kept verbatim
# from the catalog. Duplicate-label groups carry a `(#<id>)`
# disambiguator (loader rejects duplicate labels):
#   Bauer ? (Visor Rendering Broken) → 11 / 14 / 17
#   Bauer 5100                       → 15 / 19

name = "Helmet Model"
confidence = "Confirmed"
notes = """
Skater helmet model asset id on xmja.YUZp (8-bit; 256-slot field). 20
IDs catalogued below; ID 0 is "No Helmet" and ID 110 is the cage
helmet. Raws not listed surface as `raw N / uncatalogued` in the
editor.
"""

[source]
kind = "operator-research"
description = "Equipment ID catalog CSV (NHL Legacy Edition Modding Tools, Data/Equipment/helmet.csv, 2026)"

# Title scope (coordinator decision, 25 Sep 2026): these labels were established on NHL Legacy
# (PS3 textures / catalogue CSVs; Xbox 360 shares the id→file grammar; Recompiled by identity).
# Studio shows them only on a project opened as NHL Legacy; every other title shows the stored id
# as a number — a label from here is never borrowed for another title's ids.
[scope]
games = ["nhllegacy"]

[[bindings]]
field_name = "Helmet"
field_raw_id = "YUZp"
table_raw_id = "xmja"

