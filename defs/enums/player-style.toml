# Confirmed enum: Player Style (position-aware default-style code).
#
# Operator-confirmed mapping (Phase 5T research): a single 4-bit code
# encodes either a forward style (raw 5..10) or a defenseman style
# (raw 1..4). Raw 0 is unused; the goalie style code lives in a
# different field. Sub-range membership is interpreted on the consumer
# side — this enum simply ships the ten labels with their raw codes.

name = "Player Style"
confidence = "Confirmed"
notes = """
Ten-value player style code combining defenseman roles (raw 1..4) and
forward roles (raw 5..10). Mapping locked in during the operator's Phase
5T research; the unified table is the one the in-game default-style
selector renders. Raw 0 is unused. The goalie-style code is a separate
two-bit field with its own enum (not shipped here yet).
"""

[source]
kind = "operator-research"
description = "Phase 5T unified default-style promotion (NHL Legacy default.db)"

