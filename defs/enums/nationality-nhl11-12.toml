# Title-scoped nationality labels: NHL 11 / 12 (research C16 / R120b, 26 Sep 2026; developer receipt 28).
#
# Nationality codes are renumbered between titles as countries are inserted into the game's list. The
# title-owned evidence is each national team's roster in the international league: its players share
# one `intlcountry` code (R120b, dominant share 0.97–1.00). Only those 21 codes are labelled here, with the
# country the national team represents, in the operator-confirmed NHL Legacy wording for that team's code
# (so the British team's code reads "England", as on NHL 13 onward; the roster fixes which code, not the
# exact label semantics — coordinator review of R119-R121, 26 Sep 2026). Every other code (including 127, which these titles use for players without a set code but whose meaning has no title-owned evidence here) has no title-owned label
# source on this title and is shown as a number — no mapping is carried over from NHL Legacy or another
# title, and none is inferred from how often a code occurs. PS3 copies of these titles are
# byte-identical to the measured Xbox 360 databases (R120 aliases).
#
# Labels never authorise or forbid a write: any in-range code round-trips (range validation lives in
# the metadata), and the import resolves a corpus country only to a code listed here.

name = "Nationality"
confidence = "Confirmed"
notes = """
Per-title national-team codes, NHL 11 / 12. Source rows: data/r120b-nationality-label-table.json (matrix),
sources xbox360-nhl11, xbox360-nhl12. Birth-state country codes (66 and up) follow the same numbering by continuity only
(R120 section 7); Studio applies that in code with its own provenance note.
"""

[source]
kind = "research-title-owned"
description = "national-team rosters of this title (research R120b, 26 Sep 2026); codes no national team carries are shown as numbers"

