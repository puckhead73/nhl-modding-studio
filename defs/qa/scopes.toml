# Versioned freshness scope definitions — docs/plans/qa-evidence-contract.md §5.3.
#
# A scope names the *implementation* an observation depends on. Its digest is taken over file
# CONTENT only (R-CONTENT): a file touched without changing bytes invalidates nothing, and one
# changed byte invalidates exactly the records that declared the containing scope. No date, commit
# id or mtime participates.
#
# If any declared path matches nothing, that scope's digest is the literal `unknown` and every
# record declaring it is not-fresh (R-FRESH-UNKNOWN). A missing input never produces `fresh`, and a
# scope is never silently narrowed to whatever happens to exist.
#
# Bump `version` when the *meaning* of a scope changes (paths added or removed). Records declaring
# the old version keep referring to it and are reported against it; they are never rewritten.
#
# This is a proposal for the first emitters (contract §9 Q-D — implementation work, not a user
# decision). It is not a claim that any of these surfaces is verified.

schema = "qa-scopes/1"

# --------------------------------------------------------------------------------------------
# Shared foundations. Everything that parses or describes a TDB depends on these, so a change here
# invalidates every scope that shares it.
# --------------------------------------------------------------------------------------------

[[scope]]
id = "shared-core"
# v2 (C0-S2-INT1): v1 declared `defs/metadata/**`, which does not exist in this repository. Under
# R-FRESH-UNKNOWN one glob matching nothing makes the whole digest `unknown`, and because every
# other scope shares this one, *every* freshness digest was permanently `unknown` and no
# observation could ever be fresh. The declared config is now the two definition trees the engine
# actually loads (`Project::load(..., defs)`); per-title field metadata is not a `defs/` tree — it
# ships as the `*-meta.xml` beside each anchor database and is not declared here.
# v3 (C0-EMIT1-R1): that last sentence was the gap. Every emitter reads a per-title `*-meta.xml`
# (`nhlng-meta.xml` / `nhl_game-meta.xml` / `NHL07NG-meta.xml`; `save_matrix` may even fall back to
# the sibling platform's copy), every codec decision the assertions make flows from it, and the
# merge compares no fixture digest against current content — so a metadata edit left every
# dependent row `fresh`. The glob subset has no `*.xml` form and a directory prefix over `anchors/`
# would hash ~660 MB of databases and save fixtures on every emitter start, CLI call and test, so
# every `*-meta.xml` under `anchors/` is listed literally (the localisation metas ride along;
# harmless). A changed, missing or unreadable file in this list makes every scope stale or
# `unknown`. The list cannot fall behind silently: `evidence_freshness` asserts that every
# `*-meta.xml` present under `anchors/` appears here.
version = 3
paths = ["crates/tdb-core/src/**", "crates/tdb-defs/src/**"]
config = ["defs/enums/**", "defs/relationships/**"]
schema = [
  "anchors/ps3/nhl07/databases/NHL07NG-meta.xml",
