[[scope]]
id = "asset-codecs"
version = 1
shared = ["shared-core"]
paths = ["crates/tdb-rx2/src/**", "crates/tdb-archive-codec/src/**", "crates/tdb-archive-big/src/**"]

[[scope]]
id = "headmesh-convert"
version = 1
shared = ["shared-core"]
paths = ["crates/tdb-headmesh/src/**", "crates/tdb-rx2/src/**"]
recipe = [
  "defs/appearance/headmesh-matrix.toml",
  "defs/appearance/head-uv-classes.toml",
  "defs/appearance/legacy-bone-names.toml",
]
