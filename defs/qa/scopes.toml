# --------------------------------------------------------------------------------------------
# Database read and edit paths.
# --------------------------------------------------------------------------------------------

[[scope]]
id = "db-read"
# v2 (C0-S2-INT1-R1): v1 declared only `view.rs` + `surfaces.rs`, but the read assertions also drive
# `Capabilities::probe` and `RosterModel::build`, and the coverage-key mapping lives in the emitter
# test itself. A change to any of those changes what the observation means, so all three are now
# declared and prior evidence goes stale when they move.
# v3 (C0-EMIT1-R1): `Capabilities::probe` calls `attributes::{rating_label, rating_offset,
# rating_suffix, is_gen6_style_schema}` and `view::probe_main_team_encoding`; `attributes.rs` was
# not declared. `view.rs` also imports `assets::probe_birthdate_encoding`, but only for the
# player/bio views the read assertions never reach, so `assets.rs` stays out.
version = 3
shared = ["shared-core"]
paths = [
  "crates/studio-domain/src/view.rs",
  "crates/studio-domain/src/surfaces.rs",
  "crates/studio-domain/src/capabilities.rs",
  "crates/studio-domain/src/attributes.rs",
  "crates/tdb-relations/src/**",
]
schema = ["docs/audits/data/schema/**"]
mapping = ["crates/studio-domain/tests/surface_matrix.rs"]

[[scope]]
id = "db-edit"
# v2 (C0-S2-INT1-R1): the scalar and relational assertions open through `Project::load`, rebuild the
# entity model, and gate every applied operation on the whole-DB invariant audit — none of which v1
# declared. The two emitter tests carry the operation → coverage-key mapping and the invariant
# battery, so they are declared too.
# v3 (C0-EMIT1): `Project::load` builds the enum registry that every `EditSession` operation and
# `validate_invariants` consult, and `strategy-edit` resolves the cell it edits through
# `team_tabs.rs`. v2 declared the enum *definitions* (`defs/enums/**`, via `shared-core`) but not
# the registry code, so a change to `tdb-enums` or `team_tabs.rs` could not make prior evidence
# stale.
# v4 (C0-EMIT1-R1): the closure of what the edit assertions execute, at file granularity.
# `set_field` mirrors strategy edits through `view::read_u64_by_studio`; `team_strategies` (the
# `strategy-edit` cell picker) runs `view::read_field` + `view::team_name_by_id`, and `read_field`
# consults `attributes::{is_gen6_style_schema, synthetic_enum}`; every `Result` the assertions
# match on is shaped by `error.rs`. `view.rs`, `attributes.rs` and `error.rs` were not declared.
# `tdb-savedata` is imported by `project.rs` but `detect_source` returns before reaching it for
# the loose databases these two emitters feed, so it is not declared here (it is in
# `save-containers`). `assets.rs` is reachable only through view functions the edit path never
# calls and stays out.
version = 4
shared = ["shared-core"]
paths = [
  "crates/tdb-edit/src/**",
  "crates/studio-domain/src/session.rs",
  "crates/studio-domain/src/project.rs",
  "crates/studio-domain/src/team_tabs.rs",
  "crates/studio-domain/src/view.rs",
  "crates/studio-domain/src/attributes.rs",
  "crates/studio-domain/src/error.rs",
  "crates/tdb-relations/src/**",
  "crates/tdb-domain-validation/src/**",
  "crates/tdb-enums/src/**",
]
mapping = [
  "crates/studio-domain/tests/mutation_matrix.rs",
  "crates/studio-domain/tests/operation_matrix.rs",
]

# --------------------------------------------------------------------------------------------
# Save containers. Outer-console packaging (Q04) has no implementation to declare yet, so it has no
# scope: a `save-outer-package` observation would carry `implementation_digest = "unknown"` and be
# not-fresh, which is the correct report for an unimplemented required operation.
# --------------------------------------------------------------------------------------------

[[scope]]
id = "save-containers"
# v2 (C0-S2-INT1-R1): the repack proof does not stop at the codec — a ROSTER fixture takes a real
# `EditSession` scalar edit through `Project::load` and back out again, so the edit seam is part of
# what the observation depends on. The emitter test carries the detect/extract/repack split and the
# variant mapping.
# v3 (C0-EMIT1): the same `Project::load` seam builds the enum registry the semantic roster edit
# goes through; declared for the same reason as in `db-edit` v3.
# v4 (C0-EMIT1-R1): the ROSTER semantic edit is `Project::load` → `EditSession::set_field` →
# `save` → reopen, i.e. the same seam `db-edit` v4 declares: `EditTransaction::commit` runs the
# `tdb-domain-validation` invariants over a `tdb-relations` model, `set_field` consults
# `team_tabs`/`view`/`attributes`, and `error.rs` shapes every result. v3 listed only a subset of
# that closure; the list is now the `db-edit` closure plus the container codec.
version = 4
shared = ["shared-core"]
paths = [
  "crates/tdb-savedata/src/**",
  "crates/tdb-edit/src/**",
  "crates/studio-domain/src/session.rs",
  "crates/studio-domain/src/project.rs",
  "crates/studio-domain/src/team_tabs.rs",
  "crates/studio-domain/src/view.rs",
  "crates/studio-domain/src/attributes.rs",
  "crates/studio-domain/src/error.rs",
  "crates/tdb-relations/src/**",
  "crates/tdb-domain-validation/src/**",
  "crates/tdb-enums/src/**",
]
mapping = ["crates/studio-domain/tests/save_matrix.rs"]

