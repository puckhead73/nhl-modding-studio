# Head ID registry (pPaD).
#
# Named head models keyed by ubPc.pPaD. For "starred" players the engine
# happens to assign head_id == audio full-name ID (the rows in this file
# match audio-playernames.toml by raw value as of the 2015-16 snapshot),
# but the two are kept as separate registries because they bind to
# distinct fields (ubPc.pPaD vs ubPc.oazN) and could diverge in future
# roster updates.

name = "Player Head Models"
notes = """
Per-player head models. Match strategy for new EA players: look up
"Lastname, Firstname" here (case-insensitive). When present, stage the
matching `id` into `ubPc.pPaD`. When absent, leave the head ID alone
(no surname fallback — head models are individually authored).
"""

