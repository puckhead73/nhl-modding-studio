schema = "appearance-orphan-heads/1"
name = "Retired / orphan head models"
notes = """
Head assets that ship on disk as `player_<id>.rx2` but are assigned to no
roster player in the title's DB — leftovers from an earlier game/roster whose
player was since removed. Because no bio row references them, the studio's
head census can't read their name from the database, so the appearance
sweep would otherwise file them as bare `generic_<id>`. This table restores
their real identity: a swept head whose id matches an entry here is named for
the player it modelled and tagged `retired`.

Provenance: adapted from an operator-curated head-id registry (roster
"head IDs.txt", 2015-16 era) — specifically its hand-named orphan section,
which identified these from reference data. IDs are per-title (a head id is
assigned per roster), so every entry is scoped to the `game` its ids were
verified against. Only add a (game, id) pair once it is confirmed both
unreferenced in that title's DB and present on disk as `player_<id>.rx2`.
"""

