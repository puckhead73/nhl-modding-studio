# Headmesh conversion capability matrix — one [[pair]] per (source, target).
#
# The engine refuses any pair not listed here, and refuses `unproven` pairs everywhere
# except the CLI's --allow-unproven spike escape hatch. Promotion:
#   unproven → roundtrip_verified   convert + install round-trips pass against fixtures
#   roundtrip_verified → game_verified   a converted head seen rendering correctly
#                                        in the target game (manual gate)
# Every promotion carries `evidence` (docs/audits/... link + date). Never assume an
# untested pair matches a neighbour.
#
# uv_class_source / uv_class_target come from defs/appearance/head-uv-classes.toml once
# the UV spike (HM-S1) has measured that game. Class equality gates TEXTURE-ONLY
# transplants (applying a target-native texture to a converted head or vice versa);
# Path A ships source UVs + source texture together and works across classes (that is
# exactly the proven NHL24→Legacy recipe). Absent values mean "not yet measured".
#
# Keys: installed titles are `<title>-<platform>` (nhllegacy-xbox360); source-only
# corpora are bare names (nhl24).

schema = "headmesh-matrix/1"

# ---- NHL24 corpus → RW targets (the re-derivation of the proven pipeline) ----

[[pair]]
source = "nhl24"
target = "nhllegacy-xbox360"
path = "authored-weights"
status = "roundtrip_verified"
evidence = "docs/audits/nhl24-legacy-patha-roundtrip.md (2026-08-06)"
frame_adapter = "identity"
id_scheme = "rw-ppad"
notes = "Path A round-trip verified (strict re-parse, exact texlib shape, UV hash matches EA's own PS4 build, palette usage contained). Path B (donor-morph) re-verifies separately at M3; game_verified awaits the manual in-game gate."
uv_class_source = "kettle-fb"
uv_class_target = "x360-rw-v2"

