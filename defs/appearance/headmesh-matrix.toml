# ---- Authored (non-game) corpora → RW targets ----

[[pair]]
source = "cc5"
target = "nhllegacy-xbox360"
path = "donor-weights"
status = "unproven"
frame_adapter = "identity"
id_scheme = "rw-ppad"
uv_class_target = "x360-rw-v2"
notes = """
Reallusion Character Creator 5 head exports (Blender glTF I/O). Self-describing: roles \
come from the Std_* material names and weights ride inline, so there is no sidecar. \
Two measured CC5 facts drive the dedicated path (dan-suckow.glb, 2026-08-13): \
(1) the exporter cancels the armature's 0.01 scale against a 100x inverse-bind, so every \
joint's bind-time skinning matrix is identity and raw POSITION is already in the shared \
model space — hence frame_adapter = identity, verified per-file rather than assumed; \
(2) the rig is three coincident joints (hd_neutral_m / rl_boneroot / cc_base_hip), i.e. \
one rigid transform, so the authored weights carry no articulation and Path A has \
nothing to retarget. Weights therefore transfer off the donor's rigged surface by \
closest-point (crate::transfer). The source's eyes/corneas/teeth/tongue are measured (to \
place and size the donor's eyeballs and mouthbag) and then dropped; RW has no teeth or \
tongue slot and the donor's own companions are not interchangeable parts.

UV convention (verified in-game 2026-08-13): CC5 UVs are STORED, so Path C applies ZERO \
flips — the opposite of Path A. glTF 2.0 puts the texture origin at the upper-left and \
Blender's glTF I/O flips Blender's bottom-left V on export to comply, whereas the NHL24 \
Frosty exporter emits bottom-left V and needs one flip. Treating CC5 UVs as GlSourced \
rendered the face upside down on the first in-game test; removing the flip fixed it and \
the built texlib was confirmed mapping correctly onto the mesh in-game. The convention is \
therefore a per-exporter fact carried with the data, never inferred from the container.

No UV reprojection is required. Path C ships the source atlas together with the source \
UVs, which is self-consistent and renders correctly — the same property that makes Path A \
work across UV classes. uv_class_source stays unset on purpose: a CC5 atlas is \
per-character rather than a fixed class, so TEXTURE-ONLY transplants remain refused for \
this pair (that gate is about swapping a foreign texture onto these UVs, which is a \
different operation and is not what Path C does). Reprojecting CC5 UVs onto the Legacy \
x360-rw-v2 layout was investigated and dropped: it buys only Legacy-native texture \
compatibility, and it is not cheap — RW stores UVs per-vertex, so relaying seams means \
splitting vertices, not copying a UV channel. Revisit only if Legacy-native head textures \
on a CC5 mesh are actually wanted.

Unproven: mesh, weighting and texture all read acceptably in-game, but the pair stays \
ungated until a full in-game pass is signed off.
"""

# ---- RW ↔ RW (M5 — gated on the UV spike) ----

[[pair]]
source = "nhl15-xbox360"
target = "nhllegacy-xbox360"
path = "authored-weights"
status = "unproven"
frame_adapter = "identity"
id_scheme = "rw-ppad"
notes = "If rigs + UV classes match this may be near carry-through; verify, never assume."
uv_class_source = "x360-rw-v2"
uv_class_target = "x360-rw-v2"

