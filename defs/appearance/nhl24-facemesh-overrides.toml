# NHL24 facemesh import — manual folder -> player overrides.
#
# The importer (`tdb-cli --bin nhl24_facemesh_import`) matches each NHL24
# `licensed/<first_last>` source folder to a historical player by name. For
# folders that are ambiguous (two players share a first+last name) or that
# don't auto-match at all, map the folder name to the exact historical slug
# (`lastname_firstname_dd_mm_yyyy`) here. An entry here always wins over the
# automatic name match.
#
# Format:  <folder_name> = "<historical slug>"
# Example: sebastian_aho = "aho_sebastian_26_07_1997"

# Current stars whose name collides with an older, longer-career namesake the
# auto-picker preferred. NHL24's licensed asset is the modern player.
tom_wilson = "wilson_tom_29_03_1994"   # WSH; auto-picked the 1921 namesake
jack_hughes = "hughes_jack_14_05_2001" # NJD; auto-picked the 1957 namesake
# Two real Sebastian Ahos: the auto-picker takes the longer-career NYI
# defenseman (17_02_1996); NHL24's licensed asset is the CAR forward.
sebastian_aho = "aho_sebastian_26_07_1997" # auto-picked aho_sebastian_17_02_1996 (NYI D)
# Close-DOB collisions: a longer-career dupe outranked the real player, who is
# the one whose DOB matches reality (verified against the store).
jesper_bratt = "bratt_jesper_30_07_1998"     # NJD; auto-picked 30_06_1998
ryan_donato = "donato_ryan_09_04_1996"       # auto-picked 06_04_1996
travis_konecny = "konecny_travis_11_03_1997" # PHI; auto-picked 10_03_1997

# Misspelled / nickname-mismatched folder names. The NHL24 export spells some
# names differently from the historical store (typos, anglicizations, or
# Alex/Alexander-style first-name forms), so they don't auto-match. Each slug
# below was resolved against the store (longest-career candidate of the
# corrected name).
