# Arena venue-field classes — developer-owned.
#
# Transcribed from research 2026-09-21 pm handoff R51 (`research-r51-arena-venue-inventory`,
# `data/r51-arena-venue-field-inventory.json`), which inventoried every field of the arena table on
# all 27 anchors: 159 distinct fields in seven era signatures, with a **name-based candidate class**
# per field. Studio reads this map; it never reads the research lane's JSON at runtime.
#
# What a class is and is not: it is a grouping candidate derived from the field's name and its
# observed value space. It is **not** an established consumer semantic — no field here has a traced
# runtime effect (handoff R51 §3: "nothing here says which fields the game reads at runtime").
# `unknown` therefore means "not even a name guess", and Studio refuses to edit those fields.
#
# Which titles carry which field, and whether it is constant, are **not** recorded here: Studio
# computes both from the open database, so a title outside the anchor set still reports correctly.
#
# `colour = true` marks a field whose observed values are 24-bit RGB (handoff R51 §2) and which the
# UI renders as a swatch. Zone fields whose observed space never exceeds 8 bits are not marked.

# identity — the arena's own name / id / index — edited through the identity card, not here
[[field]]
name = "arenaid"
class = "identity"

[[field]]
name = "arenaname"
class = "identity"

[[field]]
name = "cityname"
class = "identity"

[[field]]
name = "index"
class = "identity"

# reference — points at another table's row
[[field]]
