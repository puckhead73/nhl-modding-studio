# NHL 10 conference labels for the local 1-bit conference (`rasz`), research R133 (2026-09-26 handoff 26): this
# title's executable lists each block's conference names as [Western, Eastern] (dictionary keys
# `WesternConference` / `EasternConference`); position fits the membership (0 = the western clubs) on every
# block that has two names. **Inferred by position** — the consumer that picks the name is not traced. Division
# names are NOT assigned (position fails for the NHL divisions); Studio labels a division by its member clubs.

[[groups]]
field = "rasz"
league_raw = 0
raw = 0
label = "Western Conference (inferred)"
confidence = "candidate"

