# NHL Legacy (PS3 / Xbox 360) and Legacy Recompiled (by reference - no independent anchor).
# Same schema fingerprint as NHL 12-15; the game id decides. Codes 7+ are shifted by the Norwegian
# league; the layout is named by NHL 16 PS4's stockleagues table.
name = "gen7-nhllegacy"
description = "NHL Legacy team league codes"
applies_to = ["nhllegacy", "legacyrecomp"]

[schema]
league_table = "kOtt"
league_field = "xMjj"
league_width = 4
required_fields = ["kOtt.iIBl", "kOtt.OwTu", "kOtt.CGMK"]
forbidden_tables = ["fsLK"]

[source]
kind = "anchor-measurement"
description = "L1.1-A cross-tab on the Legacy anchor (105d2186...c230); corroborated by NHL 16 PS4 stockleagues (7d95f1db...af7c), whose kOtt.xMjj distribution is identical; NHL conference/division groups from the prior-app Legacy audit (formerly defs/enums/conference.toml and division.toml)"

# Dictionary keys (LOC-W1, 2026-09-18): `dictionary_key` per code is TRACED — read from the static
# enum-name table in NHL Legacy Xbox 360 `default.xex` (decompressed image base 0x82000000, pointer
# table at file 0x19aa64c region, entries [93..114]); the same list NHL 16 PS4 stores in
# `stockleagues.name`. Evidence for that executable only. Code 14 (Winter Classic rows) binds to
# the key `NHL` in that table.
#
# R1 F5 (2026-09-18): the `traced` class below is scoped by `[key_witness]` to the target whose
# executable was read. Studio resolves the evidence per (game, platform): NHL Legacy Xbox 360 shows
# `traced`; NHL Legacy PS3 and Legacy Recompiled share the mapping `by-reference` (identical
# database and dictionary key set; their own executables were not inspected, and the recompiled
# build's loader behaviour is unknown). Nothing here claims which screens read a key on any target.
[key_witness]
traced_on = [{ game = "nhllegacy", platform = "xbox" }]
source = "NHL Legacy Xbox 360 default.xex static enum-name table (decompressed image base 0x82000000, pointer table at file 0x19aa64c region, entries [93..114])"
otherwise = "by-reference"

[[entries]]
raw = 0
label = "NHL"
confidence = "corroborated"
evidence = "32 rows; NHL 16 PS4 stockleagues 0 = NHL"
dictionary_key = "NHL"
key_evidence = "traced"

