# NHL 08 (PS3 / Xbox 360). 3-bit league code with the old 1-bit conference / 3-bit division pair.
name = "gen7-nhl08"
description = "NHL 08 team league codes"
applies_to = ["nhl08"]

[schema]
league_table = "kOtt"
league_field = "xMjj"
league_width = 3
required_fields = ["kOtt.rasz"]
forbidden_tables = ["fsLK"]

[source]
kind = "anchor-measurement"
description = "L1.1-A cross-tab of kOtt.xMjj against member-team abbreviations, nhlng.db 587204c3...58b9"

# Dictionary keys (LOC-W1, 2026-09-18): `dictionary_key` per code is a HYPOTHESIS — the key family
# is present in this title's own `nhl_eng_us.db` (verified by hash-resolved lookup on both platform
# anchors) and the same family is the traced table on NHL Legacy Xbox 360, but no executable of this
# title was inspected. Codes without a key have no matching key in the dictionary.
# P1.1-X (2026-09-18): the NHL 08 Xbox 360 executable has no pointer table; its keys are an ordered
# literal block after FE::CLeagueIonAdapter (VA 0x82072dec) whose order matches codes 0-5 and whose keys
# all resolve in the dictionary (by hash for AHL/ELITSERIEN/NATIONAL/CUSTOM TEAMS). The consuming code
# path is untraced, so the binding stays a hypothesis (order-inferred), not traced.
[[entries]]
raw = 0
label = "NHL"
confidence = "candidate"
evidence = "32 rows: ANA, ATL, BOS, BUF ..."
dictionary_key = "NHL"
key_evidence = "hypothesis"

