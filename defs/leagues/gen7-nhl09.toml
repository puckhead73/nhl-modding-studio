# Codes present in the executable enum with no stock team row on the anchors (P1.1-X §2): the
# label is the traced key's text in the title's own dictionary. Whether a team assigned one of these
# codes is accepted by the game is a runtime question.
[[entries]]
raw = 8
label = "Historic Teams"
confidence = "enum"
evidence = "no team row on the anchors; NHL 09 pointer table entry 8 -> HISTORIC_TEAMS ('Historic Team'); the batch's raw code 8 'CEN' lead"
dictionary_key = "HISTORIC_TEAMS"
key_evidence = "traced"

