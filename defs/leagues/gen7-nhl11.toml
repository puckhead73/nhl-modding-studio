# NHL 11 (PS3 / Xbox 360). CHL schedule tables appear; still the old 1-bit conference field.
name = "gen7-nhl11"
description = "NHL 11 team league codes"
applies_to = ["nhl11"]

[schema]
league_table = "kOtt"
league_field = "xMjj"
league_width = 4
required_fields = ["kOtt.rasz"]
required_tables = ["jEiu"]
forbidden_tables = ["fsLK"]

[source]
kind = "anchor-measurement"
description = "L1.1-A cross-tab of kOtt.xMjj against member-team abbreviations, nhlng.db 461f8d64...3c88"

# Dictionary keys (LOC-W1, 2026-09-18): `dictionary_key` per code is a HYPOTHESIS — the key family
# is present in this title's own `nhl_eng_us.db` (verified by hash-resolved lookup on both platform
# anchors) and the same family is the traced table on NHL Legacy Xbox 360, but no executable of this
# title was inspected. Codes without a key have no matching key in the dictionary.
# R1 F5 + research handoff P1.1-X (2026-09-18, docs/research/overnight-2026-09-18/10-phase1-league-identity-xbox360.md): the code -> key table is a static
# pointer table in each Xbox 360 executable, decrypted and read tonight; every key was resolved in the
# title's own dictionary (each X: copy equals the committed Xbox 360 anchor). `traced` below is scoped by
# [key_witness] to those Xbox targets; the PS3 copies of the same vocabulary show `by-reference` (their
# executables are encrypted and were not inspected; the PS3 database/dictionary equal the Xbox bytes on
# NHL 10-Legacy, which raises the prior but is not a trace). Which screens read a key is untraced everywhere.
[key_witness]
traced_on = [{ game = "nhl11", platform = "xbox" }]
source = "Xbox 360 default.xex static league pointer table (nhl11 pointer table at VA 0x834a28a0 (image 70e465868042…)); research probes league_tables.py / ptr_table.py"
otherwise = "by-reference"

