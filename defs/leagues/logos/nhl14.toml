# League logo art index for nhl14: the executable's second small table, league code -> logo index,
# which names the frontend packages `fe/ion/artassets/leaguelogos{,big,small,wide}/l<index>.big`
# (Xbox 360 and, by identity of the file names, PS3). Baked from research handoff P1.4-X
# (2026-09-18, docs/research/overnight-2026-09-18/14-phase1-league-logo-assets.md;
# data/xbox360-league-logo-map.json): u32 BE array at VA 0x82036648 in the nhl14 Xbox 360 default.xex,
# one entry per league code, located by the unique sequence 0,1,2,3,6,7 and tied to the key table by
# length. The index is one family-wide enum (PS4 stores it in `stockleagues.artid`). Several codes
# share one logo on purpose. What each index depicts is the research lane's reading of the decoded
# Legacy previews — queued for the user's visual check; screen consumers are untraced.
game = "nhl14"
applies_to = ["nhl14"]

[witness]
game = "nhl14"
platform = "xbox"
source = "nhl14 default.xex logo-index table at VA 0x82036648 (P1.4-X, league_logo_map.py)"

