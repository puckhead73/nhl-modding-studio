# data/ps4-competition-groups.json): a pointer array of dictionary keys read from this install's own eboot.bin
# at VA 0x3f91cc0 (stride 8; id 1 = NHL, id k >= 6 = entry k-6 from `WesternConference`), cross-checked against
# the same install's base nhl_game.db. Per-row `evidence` is the research's key-lookup class: traced-static
# (array order == DB usage) / inferred (usage-only; array order disagrees or lacks the id) / unknown (no key
# found; `hypothesis_key` is a hint, never the name). `kind` / `leagues` are INFERRED from how the witness
# team table uses each id (a league group heads a block; a used sub-group belongs to the head the majority of
# its rows carry; an unused sub-group joins a used sibling of its key family or a tournament head; otherwise it
# has no established parent). Ids are TITLE-SPECIFIC. Labels resolve through the title's own dictionary
# (the `key`) when one is attached; `text` is the English text observed. The witnessed structure section at the
# end (signature, known databases, conference/division pairs per block) is measured on the witness database.
