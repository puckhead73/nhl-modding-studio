# Competition groups for nhl12 (NHL 12-Legacy family): the table the executable indexes with the team
# row's global group ids `leaguegroup` (iIBl), `conferencegroup` (OwTu) and `divisiongroup` (CGMK).
# Baked from research handoff P1.2-X (2026-09-18, docs/research/overnight-2026-09-18/
# 12-phase1-competition-structure-and-schedules.md; data/xbox360-competition-groups.json): sequential
# (dictionary key, league art id) pairs read from the nhl12 Xbox 360 `default.xex` at VA 0x837b5040;
# `kind` and `league_code` are derived from how the anchor team rows use each id (block structure:
# a league group heads a block, the following conference/division groups belong to it). Ids are
# TITLE-SPECIFIC: a value copied from another title is silently wrong. Labels resolve through the
# title's own dictionary (the `key`) when one is attached; `text` is the English text observed.
# `used = false`: no anchor team row carries the id (tournament pools, unused divisions).
game = "nhl12"
applies_to = ["nhl12"]

[fields]
league = "iIBl"
conference = "OwTu"
division = "CGMK"

[witness]
game = "nhl12"
platform = "xbox"
source = "nhl12 default.xex group table at VA 0x837b5040 (P1.2-X, group_table.py); PS3 by identity of the database fields"

