# --------------------------------------------------------------------------------------------
# Companion / cardinality. A Player is the `ubPc` bio row plus companion rows that SHARE its primary
# key `wBIz` (measured: `wBIz` — named `game_id` on this platform — is the key field on ubPc and on all
# four companions in this snapshot, 14 bits wide). MEASURED on this anchor (C0-REG4): each
# companion table holds one row per key, every key resolves to a bio row, the two tables EA names
# `exhibitionskater*` hold exactly the same 5066 players, the two it names `exhibitiongoalie*` hold
# exactly the same 566, the sets are disjoint and together cover all 5632 bio rows. The
# roster-relationships audit (verified over nhl11 -> legacy `nhlng.db`) does not cover this platform
# and is not cited; operation-matrix.csv carries create/clone/delete rows for `ps4,nhl16` as
# corroboration only.
# --------------------------------------------------------------------------------------------

[[companion_rule]]
primary_table = "ubPc"
[companion_rule.declared]
state = "established"
confidence = "measured"
provenance = [
  "crates/tdb-canonical/src/target_ps4_tests.rs#nhl16_ps4::position_codes_partition_the_bio_table_exactly_as_the_metadata_named_companions_do",
  "docs/audits/data/schema/ps4-nhl16.json#dSvy (exhibitionskaterai)",
  "docs/audits/data/schema/ps4-nhl16.json#xmja (exhibitionskaterequipment)",
  "docs/audits/data/schema/ps4-nhl16.json#mHuy (exhibitiongoalieai)",
  "docs/audits/data/schema/ps4-nhl16.json#fMVl (exhibitiongoalieequipment)",
  "docs/audits/data/operation-matrix.csv#ps4,nhl16",
]
note = "MEASURED on this anchor by the named case (C0-REG4); the skater/goalie label of each companion is EA's metadata table name, not an enum file. One-to-one: 5066 distinct keys in dSvy and in xmja, 566 in mHuy and in fMVl, none duplicated, all resolving to a bio row. operation-matrix.csv (create-skater / create-goalie / clone / delete on `ps4,nhl16`) is retained as corroboration; the roster-relationships audit was verified on gen7 anchors only and is not relied on here."
[companion_rule.declared.value]
shared_key_field = "wBIz"
[[companion_rule.declared.value.companion]]
table = "dSvy"
cardinality = "one-to-one"
applies_when = "position-skater"
[[companion_rule.declared.value.companion]]
table = "xmja"
cardinality = "one-to-one"
applies_when = "position-skater"
[[companion_rule.declared.value.companion]]
table = "mHuy"
cardinality = "one-to-one"
applies_when = "position-goalie"
[[companion_rule.declared.value.companion]]
table = "fMVl"
cardinality = "one-to-one"
applies_when = "position-goalie"

# The 3-bit width and 0..7 range are measured in the snapshot. The code ASSIGNMENT is MEASURED on
# this anchor (C0-REG4): the 566 bio rows that own rows in the metadata-named goalie companion
# tables all store 4 and nothing else; the 5066 that own skater companion rows store exactly
# {0, 1, 2, 3} (1275 / 1038 / 993 / 1760); no row is unassigned. `defs/enums/position.toml` (an uncommitted
# `NHL Legacy default.db`, five named players) was NOT the source of the expected labels — EA's
# metadata table names were — and it agrees. What 0..3 mean individually is NOT established here.
[position_discriminator]
state = "established"
confidence = "measured"
provenance = [
  "crates/tdb-canonical/src/target_ps4_tests.rs#nhl16_ps4::position_codes_partition_the_bio_table_exactly_as_the_metadata_named_companions_do",
  "docs/audits/data/schema/ps4-nhl16.json#ubPc.vjla",
  "docs/audits/data/schema/ps4-nhl16.json#mHuy (exhibitiongoalieai)",
  "docs/audits/data/schema/ps4-nhl16.json#dSvy (exhibitionskaterai)",
]
note = "MEASURED on this anchor: goalie code {4} and skater codes {0, 1, 2, 3} partition the 5632 bio rows exactly as ownership of a row in the EA-named goalie / skater companion tables does. Codes 5..7 of the 3-bit field are stored on no row. The per-code labels of 0..3 (centre, wings, defence) are not established here and are not declared."
[position_discriminator.value]
table = "ubPc"
field = "vjla"
skater_codes = [0, 1, 2, 3]
goalie_codes = [4]
