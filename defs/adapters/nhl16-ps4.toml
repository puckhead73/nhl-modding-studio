# --- ratings: the skater companion's 7-bit cells — the stored value IS the rating ---------------
# MEASURED on this anchor (C0-REG4): `dSvy.eWUF` (`c_overall`) and `dSvy.AdEb` (`c_speed`) are 7 bits
# wide with declared range 0..99; the gen7 6-bit/offset-36 regime is a different storage class and
# was not carried here. The goalie companion `mHuy` also carries `c_overall`; it is not mapped.

[[mapping]]
canonical = "player.rating_overall"
table = "dSvy"
field = "eWUF"
read_transform = "identity"
write_transform = "identity"
inverse_verified = false
confidence = "derived"
qualification = "implemented"
automated_case = "studio_domain::ratings_write_codec"
provenance = [
  "docs/audits/ratings-write-codec.md",
  "crates/studio-domain/tests/ratings_write_codec.rs#ratings_write_is_inverse_of_read_ps4_direct",
  "docs/audits/data/schema/ps4-nhl16.json#dSvy.eWUF",
  "crates/tdb-canonical/src/target_ps4_tests.rs#nhl16_ps4::seven_bit_ratings_store_the_human_value_directly_on_this_anchor",
]
note = "That `dSvy.eWUF` is the stored overall rating is DERIVED from the field's EA metadata name `c_overall` in this snapshot (the PS4 skater block names its ratings `c_*`). The field is 7 bits with a declared range of 0..99 and stores 36..99 on this anchor (measured, C0-REG4): the stored value IS the rating, with no offset — the gen7 6-bit/offset-36 regime does not apply here and was not carried here. The named case `ratings_write_is_inverse_of_read_ps4_direct` ran on nhl15/ps4, not on this target, and reads a skater's first rating cell rather than this field specifically, so the mapping is `implemented`, not `automated-tested`, and `inverse_verified` stays false: an identity write is its own inverse by definition, but no case has written this field on this anchor. The human range 0..99 is DERIVED by the validator from the identity transform and the storage range — it is never declared."

[mapping.storage]
state = "established"
