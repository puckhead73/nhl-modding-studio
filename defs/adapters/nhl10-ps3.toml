# Target adapter — NHL 10, PlayStation 3 (gen7, big-endian, TDB v6). Schema `target-adapter/2`.
#
# Package C0-REG3 (2026-09-15). EVIDENCE-BACKED AND DELIBERATELY PARTIAL: 7 canonical properties
# over 9 physical fields, every number read from THIS target's committed snapshot
# (`docs/audits/data/schema/ps3-nhl10.json`) and every non-physical fact cited to an audit row,
# matrix row, named case or fixture that names NHL 10 on PlayStation 3. The existing adapters were
# STRUCTURAL references only (which blocks exist, in what shape); no value was carried from any of
# them. Where the layout resembles a neighbour, the resemblance is measured here, not assumed — and
# the differences are real: on this anchor `Kswi` (day) sits at bit 1400, `JKLp` (month) at 1408,
# `GRkp` (handedness) at 1412 and `dXSB` (main team) at 0.
#
# MEASURED DIRECTLY (C0-REG3, not inherited): `anchors/ps3/nhl10/databases/nhlng.db` (sha256
# e87b8c80…) and `anchors/ps3/nhl10/databases/nhlng-meta.xml` (sha256 6c335a62…) are byte-identical
# to their Xbox 360 counterparts. That identity is stated as an observation about two files; it
# carries NO save capacity, deployment behaviour or runtime conclusion across targets, and nothing
# in this file rests on it: this adapter cites only PlayStation 3 files. Capacities are read from THIS
# target's own ROSTER fixture,
# `anchors/ps3/nhl10/savefiles/BLUS303450200 - ROSTER/SYS-DATA` (sha256 ceba4776…; decoded payload
# sha256 d2f68d6b…) (a RawV1 container, whose WRITE path is experimental; only the read path is used here), as OBSERVED DIRECTORY CAPACITY, which is not a demonstrated
# runtime limit.
#
# Semantics are measured on this anchor by the named cases in
# `crates/tdb-canonical/src/target_batch_tests.rs` (module `nhl10_ps3`), with expected labels taken from EA's
# metadata names and declared foreign keys — never from the enum or probe under test. Handedness
# stays blocked (no independently supported label exists here) and the main-team parent table stays
# a candidate (containment plus a name is not a foreign key). `team.name` read / edit / serialize /
# reopen is automated-tested on an in-memory copy of this anchor.
#
# THIS TITLE DIVERGES FROM NHL 11 ONWARDS IN THREE MEASURED WAYS, none carried from a neighbour:
#   1. the birth-date month/day are stored 1-indexed (stored ranges 1..=12 / 1..=31), so the
#      canonical transform is identity, not index-origin-0;
#   2. the main-team pointer stores the roster slot's team code AS-IS over a 0..255 field (not slot
#      team + 1 over -1..254), so pattern 0 is team code 0 and no absence code can be established;
#   3. the 6-bit rating offset is UNRESOLVED: the ratings audit names this title under offset 36,
#      but the production probe resolves 50 on this anchor (no skater/goalie 6-bit value exceeds
#      49); `player.rating_speed` is therefore blocked with the probe's result as a candidate.
#
# The mapped set is a representative sample over the roster core and the team table; the unmapped
# remainder is a recorded gap, never an implied identity mapping. Adding this file does not make the
# target complete, supported or game-verified.
#
# Rules this file is validated against (crates/tdb-canonical): see the head of
# defs/adapters/nhl15-xbox360.toml — identical contract, `target-adapter/2`.
#
# Confidence, per fact:
#   measured — read directly out of committed evidence (the schema snapshot, an audit's table, a
#              matrix row for `ps3,nhl10`, a named case that lists this anchor or this fixture);
#   derived  — a measured fact on other material plus a stated argument that it carries here;
#   asserted — recorded from repository source/prose with a citation, not independently measured.

schema = "target-adapter/2"
adapter_version = 2
canonical_schema_version = 1
target = "nhl10-ps3"
generation = "gen7"
endian = "big"
tdb_version = 6
physical_snapshot = "docs/audits/data/schema/ps3-nhl10.json"

# 86 tables / 1769 fields exist in the snapshot; 9 physical fields are mapped here (the three
# birth-date components count individually). The field total is read from this target's own
# snapshot.
[coverage_declared]
