]
note = "BLOCKER: the rating offset regime is not established for this target because two committed sources disagree ON THIS ANCHOR. (a) The ratings-write-codec audit's regime table scopes the 6-bit / offset-36 row to `NHL 10 -> Legacy / 11-21 (PS3/X360)`, naming this title. (b) The production probe the same audit designates as the offset's source, `studio_domain::view::sixbit_rating_offset`, returns 36 only when some 6-bit field on the skater or goalie block stores a value above 49 and otherwise 50 (its own comment: the gen6 NHL 07 50..99 scale); MEASURED on this anchor by the named case (C0-REG3), the largest value stored in any of the 24 six-bit `dSvy` fields and 21 six-bit `mHuy` fields is 49, so the probe resolves 50 here, and `p_speed` itself spans 2..47 (human 38..83 under 36, 52..97 under 50). On the NHL 11, 12 and 13 anchors the same probe resolves 36 (values up to 63 are stored). What is MEASURED here: that `dSvy.qPWY` is named `p_speed` in this snapshot, its layout, and the stored maximum. What is NOT: which offset the game applies. The named case `ratings_write_codec.rs` ran the 6-bit regime on nhl14/ps3, not here, and is not cited as a case for this field. An operative transform needs either a controlled observation on this title or a corrected audit that resolves the disagreement. The existing `nhl10-xbox360` adapter (byte-identical main DB) declares offset 36 as derived and is NOT amended by this package — recorded as a finding."

