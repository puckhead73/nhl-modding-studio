# Target adapter — NHL 10, Xbox 360 (gen7, big-endian, TDB v6). Schema `target-adapter/2`.
#
# This adapter exists to make one point concretely: **an adjacent title does not inherit its
# neighbour's facts.** Against defs/adapters/nhl15-xbox360.toml, on the same platform and the same
# generation, this target disagrees on four separate axes:
#
#   1. birth month/day are 1-indexed here and 0-indexed on NHL 11-21, with byte-identical EA
#      metadata either way;
#   2. `ubPc.dXSB` (main team) has a declared range of 0..255 here against -1..254 there — a MEASURED
#      difference in how the field's bits decode. (Its index origin differs too, but see the
#      correction below: that difference is a documented expectation, not something this repository
#      measures, so it is recorded as a candidate and drives nothing.)
#   3. the skater ratings block is the earlier `p_*` set here (34 fields) against NHL 15's `c_*` set,
#      so the same canonical rating maps to a different field id;
#   4. the name budget is 40 bytes here against 25 there.
#
# Copying the NHL 15 adapter to NHL 10 would move every player's birthday, decode the team pointer
# against the wrong range, map ratings onto field ids that do not exist here, and let a 40-byte name
# through a 25-byte budget. Same rules and same validator as every other adapter.
#
# CORRECTION (package C0-CAN1-R1). The first version of this file claimed two further divergences it
# could not support: that NHL 10 "cannot store no team" (an inference from a declared range) and that
# the stored overall rating is target-ABSENT (a name search that found nothing). Both are corrected
# below and both are now recorded as what they actually were — an unproven reading and a discovery
# note.

schema = "target-adapter/2"
adapter_version = 2
canonical_schema_version = 1
target = "nhl10-xbox360"
generation = "gen7"
endian = "big"
tdb_version = 6
physical_snapshot = "docs/audits/data/schema/xbox360-nhl10.json"

# 86 tables / 1769 fields exist in the snapshot; 8 physical fields are mapped here (the three
# birth-date components count individually).
[coverage_declared]
tables_total = 86
fields_total = 1769
fields_mapped = 8
note = "Read from the committed snapshot. Representative sample; the unmapped remainder is UNKNOWN, not identity-mapped."

