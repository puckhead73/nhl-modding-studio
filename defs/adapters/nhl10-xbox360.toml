# --------------------------------------------------------------------------------------------
# The stored overall rating: identity UNRESOLVED.
#
# CORRECTION (package C0-CAN1-R1). This was previously declared `reason = "target-absent"` — a claim
# that NHL 10 has no stored overall rating at all — on the strength of a metadata NAME search. That
# was an over-claim, and the rule it satisfied (`omission-without-proof`) was satisfied by citing the
# search rather than a proof.
#
# A search returning no name containing "overall" establishes exactly one thing: THAT SEARCH FOUND NO
# NAMED MATCH. It does not establish semantic absence. EA metadata names are not a complete or
# reliable index of meaning — this very adapter relies on `p_*` vs `c_*` prefix drift between two
# adjacent titles, and elsewhere in the repository fields are identified by probing stored values
# because their metadata is uninformative. An overall rating could be stored under a name the search
# does not match, be derived from another field, or live outside the tables examined.
#
# The honest state is therefore `unknown-field-identity`: we have not found the field. The search
# result is retained below as a DISCOVERY NOTE — a record of where someone already looked, so the
# next person does not repeat it — and explicitly not as an authorization to omit.
#
# What this does NOT decide: whether the canonical model should carry a stored overall, a computed
# one, or both. That is P1 and remains open.
# --------------------------------------------------------------------------------------------

[[omission]]
canonical = "player.rating_overall"
reason = "unknown-field-identity"
detail = "DISCOVERY NOTE, NOT PROOF OF ABSENCE. A name search over this target's committed snapshot found 0 fields whose metadata name contains `overall`, across all 86 tables / 1769 fields; NHL 15's snapshot has 15, including the `dSvy.eWUF` (`c_overall`) this property maps to there, and NHL 10's skater block is the earlier `p_*` set of 34 fields. That records where the search looked and what it did not find. It does not prove the target lacks a stored overall: a name search cannot establish semantic absence, and this schema family is known to drift its field names between adjacent titles. To move this to `target-absent`, identify the target's complete rating representation and show the value is not carried anywhere in it."
provenance = ["docs/audits/data/schema/xbox360-nhl10.json"]

