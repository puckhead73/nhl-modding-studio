# --------------------------------------------------------------------------------------------
# Companion / cardinality — the same shared-key 1:1 shape as NHL 15, stated on its own evidence.
# --------------------------------------------------------------------------------------------

# CORRECTION (package C0-CAN1-R2). Previously `derived`, on the argument that this target's own
# snapshot shows `wBIz` is the declared key of `ubPc` and of each companion table, plus the
# roster-relationships audit's rule. Both halves of that argument fail.
#
# The audit states its own range — VERIFIED against nhl11 -> legacy — and NHL 10 is outside it.
# An audit that excludes this title cannot establish these semantics for it.
#
# And the shared-key observation does not fill the gap. That two tables declare the same primary
# key establishes that rows CAN be addressed by a common id. It does not establish the
# CARDINALITY (one-to-one rather than zero-or-one or one-to-many), it does not establish
# MANDATORY PRESENCE (that a usable skater must have both companions), and it says nothing at all
# about the SKATER/GOALIE CONDITION. Those are the three things this block asserts, and a key
# declaration is evidence for none of them.
#
# So this is a candidate for a stronger reason than NHL 15's: there, the rule is proven and only
# its discriminator is missing; here, the rule itself is unproven on this target.
[[companion_rule]]
primary_table = "ubPc"
[companion_rule.declared]
state = "unknown"
note = "The companion cardinality, mandatory presence and position conditions are not established on this target."
[companion_rule.declared.candidate]
