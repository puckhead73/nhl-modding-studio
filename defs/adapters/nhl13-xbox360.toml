# Target adapter — NHL 13, Xbox 360 (gen7, big-endian, TDB v6). Schema `target-adapter/2`.
#
# Package C0-REG2 (2026-09-15). EVIDENCE-BACKED AND DELIBERATELY PARTIAL: 8 canonical properties
# over 10 physical fields, every number read from THIS target's committed snapshot
# (`docs/audits/data/schema/xbox360-nhl13.json`) and every non-physical fact cited to an audit row,
# matrix row, named case or fixture that names NHL 13 on Xbox 360. The existing adapters were
# STRUCTURAL references only (which blocks exist, in what shape); no value was carried from any of
# them. Where the layout resembles a neighbour, the resemblance is measured here, not assumed — and
# the differences are real: on this anchor `Kswi` (day) sits at bit 938, `JKLp` (month) at 954,
# `GRkp` (handedness) at 958 and `dXSB` (main team) at 0.
#
# Capacities are read from THIS target's own ROSTER fixture,
# `anchors/xbox360/nhl13/savefiles/ROSTER 20260627051601/ROSTER 20260627051601` (sha256 d4bd2f7c…; decoded payload
# sha256 0e16b80e…), as OBSERVED DIRECTORY CAPACITY, which is not a demonstrated
# runtime limit.
#
# Semantics are measured on this anchor by the named cases in
# `crates/tdb-canonical/src/target_batch_tests.rs` (module `nhl13_xbox360`), with expected labels taken from EA's
# metadata names and declared foreign keys — never from the enum or probe under test. Handedness
# stays blocked (no independently supported label exists here) and the main-team parent table stays
# a candidate (containment plus a name is not a foreign key). `team.name` read / edit / serialize /
# reopen is automated-tested on an in-memory copy of this anchor.
#
# The mapped set is a representative sample over the roster core and the team table; the unmapped
# remainder is a recorded gap, never an implied identity mapping. Adding this file does not make the
# target complete, supported or game-verified.
#
# Rules this file is validated against (crates/tdb-canonical): see the head of
# defs/adapters/nhl15-xbox360.toml — identical contract, `target-adapter/2`.
#
# Confidence, per fact:
#   measured — read directly out of committed evidence (the schema snapshot, an audit's table, a
#              matrix row for `xbox360,nhl13`, a named case that lists this anchor or this fixture);
#   derived  — a measured fact on other material plus a stated argument that it carries here;
#   asserted — recorded from repository source/prose with a citation, not independently measured.

