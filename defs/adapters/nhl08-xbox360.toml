# Target adapter — NHL 08, Xbox 360 (gen7, big-endian, TDB v6). Schema `target-adapter/2`.
#
# Package C0-REG5 (2026-09-15). EVIDENCE-BACKED AND DELIBERATELY PARTIAL: 8 canonical properties
# over 9 physical fields, every number read from THIS target's committed snapshot
# (`docs/audits/data/schema/xbox360-nhl08.json`) and every non-physical fact cited to an audit row,
# matrix row, named case or fixture that names NHL 08 on Xbox 360. The later-generation
# adapters were STRUCTURAL references only (which blocks exist, in what shape); no field identity,
# origin, transform, sentinel rule, companion rule or capacity figure was carried from any of them —
# a shared field name or a matching layout is not semantic proof. Measured here instead: on this anchor the main-team pointer `dXSB` is stored AS-IS over an unsigned 0..255 field (pattern 0 is team code 0 as much as un-rostered), birth month/day are 1-origin, the name fields are 320 bits, the rating regime is named by no audit row.
#
# MEASURED DIRECTLY (C0-REG5, not inherited): `anchors/xbox360/nhl08/databases/nhlng.db` (sha256 587204c3…) and
# `anchors/xbox360/nhl08/databases/nhlng-meta.xml` (text-identical, LF-normalised digest) are byte-identical to
# PlayStation 3 NHL 08's files. That identity is stated as an observation about four files; it
# carries NO save capacity, deployment behaviour or runtime conclusion across targets, and nothing
# in this file rests on it: this adapter cites only Xbox 360 files.
# Likewise the committed ROSTER fixture `anchors/xbox360/nhl08/savefiles/ROSTER1 20260718064658/ROSTER1 20260718064658`
# is byte-identical to `anchors/ps3/nhl08/savefiles/BLUS30062-002-000 - ROSTER/SYS-DATA`: two folders, one file, no
# capture record for either — recorded as an observation; the fixture's save capacity is blocked
# regardless (below), so nothing rests on it.
#
# MEASURED DIRECTLY (C0-REG5): the main anchor `anchors/xbox360/nhl08/databases/nhlng.db` (sha256 587204c3…)
# parses as a big-endian TDB v6 with 79 tables, header CRC and size valid, PACKED on every table.
# The committed ROSTER fixture (`anchors/xbox360/nhl08/savefiles/ROSTER1 20260718064658/ROSTER1 20260718064658`) decodes through the
# committed codec to a small TDB holding none of the roster-core tables, and the rest of the
# container is not decoded: the save capacity is BLOCKED on this target (no codec research was
# done), and the packed main DB is NOT read off as a substitute.
#
# Semantics are measured on this anchor by the named cases in
# `crates/tdb-canonical/src/target_early_tests.rs` (module `nhl08_xbox360`), with expected labels taken from EA's
# metadata names and declared foreign keys — never from the enum or probe under test. Handedness
# stays blocked (no independently supported label exists here), the main-team parent table stays a
# candidate, no absence code is established for the as-is main-team pointer, and `team.name` is mapped to the field EA names `fullname` (`kOtt.YmkJ`).
#
# The mapped set is a representative sample over the roster core and the team table; the unmapped
# remainder is a recorded gap, never an implied identity mapping. Adding this file does not make the
# target complete, supported or game-verified.
#
# Rules this file is validated against (crates/tdb-canonical): see the head of
# defs/adapters/nhl15-xbox360.toml — identical contract, `target-adapter/2`.
#
# Confidence, per fact:
#   measured — read directly out of committed evidence (the schema snapshot, an audit's table, a
#              matrix row for `xbox360,nhl08`, a named case that lists this anchor or this fixture);
#   derived  — a measured fact on other material plus a stated argument that it carries here;
#   asserted — recorded from repository source/prose with a citation, not independently measured.

