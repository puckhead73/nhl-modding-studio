# Target adapter — NHL 15, Xbox 360 (gen7, big-endian, TDB v6). Schema `target-adapter/2`.
#
# EVIDENCE-BACKED EXAMPLE, DELIBERATELY PARTIAL. Seven canonical properties over nine physical
# fields, each citing in-repo evidence. It is not a claim that this target is fully mapped:
# `coverage_declared` states exactly what fraction of the physical schema is mapped, and the unmapped
# remainder is a recorded gap, never an implied identity mapping.
#
# Rules this file is validated against (crates/tdb-canonical):
#   * every `canonical` resolves to a property in defs/canonical/project-schema.toml;
#   * every `table` reference resolves to a [[table]] declaration in this file;
#   * every mapping declares BOTH a read and a write transform — a non-identity read with an
#     unknown write is refused (Q07a.1: "every read transform must have a verified inverse write");
#   * every constraint block declares `established` / `unknown` / `not-applicable`. An established
#     block must carry a confidence other than "unknown", at least one provenance citation and a
#     `value` table; an unknown or not-applicable block must carry none of those;
#   * a placeholder string ("unknown", "tbd", "") is never a value — an unestablished identity is an
#     ABSENT key;
#   * a `default` may not be a placeholder — an unknown target default BLOCKS rather than
#     substituting;
#   * an adapter may never declare `qualification = "game-verified"`. Qualification comes from the
#     evidence system (docs/plans/qa-evidence-contract.md), never from a schema file.
#
# Confidence, per fact:
#   measured — read directly out of committed evidence (the schema snapshot, an audit's table);
#   derived  — a measured fact on other material plus a stated argument that it carries here;
#   asserted — recorded from repository source/prose with a citation, not independently measured.

schema = "target-adapter/2"
adapter_version = 2
canonical_schema_version = 1
target = "nhl15-xbox360"
generation = "gen7"
endian = "big"
tdb_version = 6
physical_snapshot = "docs/audits/data/schema/xbox360-nhl15.json"

# 134 tables / 2969 fields exist in the snapshot; 9 physical fields are mapped here (the three
# birth-date components count individually).
[coverage_declared]
tables_total = 134
fields_total = 2969
fields_mapped = 9
note = "Representative sample. The unmapped remainder is UNKNOWN, not identity-mapped."

