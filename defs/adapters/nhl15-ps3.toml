# Target adapter — NHL 15, PlayStation 3 (gen7, big-endian, TDB v6). Schema `target-adapter/2`.
#
# Package C0-REG1b (2026-09-14). EVIDENCE-BACKED AND DELIBERATELY PARTIAL: eight canonical properties
# over ten physical fields, every number read from THIS target's committed snapshot
# (`docs/audits/data/schema/ps3-nhl15.json`) and every non-physical fact cited to an audit row,
# matrix row, named case or fixture that names NHL 15 on PS3. The NHL 15 Xbox 360 adapter and the
# Legacy adapter were STRUCTURAL references only (which blocks exist, in what shape); no value was
# carried from either. Where the layout resembles a neighbour, the resemblance is measured here,
# not assumed — and the differences are real: on this anchor `Kswi` (day) sits at bit 959, `JKLp`
# (month) at 977 and `GRkp` (handedness) at 981, where Legacy has 958 / 975 / 979.
#
# MEASURED DIRECTLY (C0-REG1b, not inherited): `anchors/ps3/nhl15/databases/nhlng.db` (sha256
# 028ae06a…) and `anchors/ps3/nhl15/databases/nhlng-meta.xml` (sha256 bc0588da…) are byte-identical
# to their Xbox 360 counterparts. That identity is stated as an observation about two files; it
# carries NO save capacity, deployment behaviour or runtime conclusion across targets, and nothing
# in this file rests on it. Capacities are read from THIS target's own ROSTER fixture,
# `anchors/ps3/nhl15/savefiles/BLUS314360200 - ROSTER/SYS-DATA` (sha256 fd234dc0…; decoded payload
# sha256 362c40de…), as OBSERVED DIRECTORY CAPACITY, which is not a demonstrated runtime limit.
#
# Semantics are measured on this anchor by the named cases in
# `crates/tdb-canonical/src/nhl15_ps3_tests.rs`, with expected labels taken from EA's metadata
# names and declared foreign keys — never from the enum or probe under test. Handedness stays
# blocked (no independently supported label exists here) and the main-team parent table stays a
# candidate (containment plus a name is not a foreign key). `team.name` read / edit / serialize /
# reopen is automated-tested on an in-memory copy. The sentinel `raw` for `literal-code` is the
# unsigned STORED BIT PATTERN, matched before any storage decode; the codec-order case uses a TEST
# HELPER — this repository ships no production executor of it.
#
# `coverage_declared` states exactly what fraction of the physical schema is mapped; the unmapped
# remainder is a recorded gap, never an implied identity mapping. Adding this file does not make the
# target complete, supported or game-verified.
#
# Rules this file is validated against (crates/tdb-canonical): see the head of
# defs/adapters/nhl15-xbox360.toml — identical contract, `target-adapter/2`.
#
# Confidence, per fact:
#   measured — read directly out of committed evidence (the schema snapshot, an audit's table, a
#              matrix row for `ps3,nhl15`, a named case that lists this anchor or this fixture);
#   derived  — a measured fact on other material plus a stated argument that it carries here;
#   asserted — recorded from repository source/prose with a citation, not independently measured.

schema = "target-adapter/2"
adapter_version = 2
canonical_schema_version = 1
target = "nhl15-ps3"
generation = "gen7"
endian = "big"
tdb_version = 6
physical_snapshot = "docs/audits/data/schema/ps3-nhl15.json"

# 134 tables / 2969 fields exist in the snapshot; 10 physical fields are mapped here (the three
# birth-date components count individually). The field total is read from this target's own
# snapshot (Legacy's is 2965).
[coverage_declared]
tables_total = 134
fields_total = 2969
fields_mapped = 10
note = "Representative sample over the roster core and the team table. The unmapped remainder is UNKNOWN, not identity-mapped."

