# --------------------------------------------------------------------------------------------
# Companion / cardinality. A Player is the `ubPc` bio row plus companion rows that SHARE its primary
# key `wBIz` (measured: `wBIz` is the key field on ubPc, dSvy and mHuy in this snapshot). MEASURED on
# this anchor (C0-REG1b): each companion table holds one row per key, every key resolves to a bio
# row, the two tables EA names `exhibitionskater*` hold exactly the same 4978 players, the two it
# names `exhibitiongoalie*` hold exactly the same 556, the sets are disjoint and together cover all
# 5534 bio rows. On Legacy this was first a candidate; here it is measured from the start.
# --------------------------------------------------------------------------------------------

[[companion_rule]]
primary_table = "ubPc"
[companion_rule.declared]
state = "established"
confidence = "measured"
provenance = [
  "crates/tdb-canonical/src/nhl15_ps3_tests.rs#position_codes_partition_the_bio_table_exactly_as_the_metadata_named_companions_do",
  "docs/audits/data/schema/ps3-nhl15.json#dSvy (exhibitionskaterai)",
  "docs/audits/data/schema/ps3-nhl15.json#xmja (exhibitionskaterequipment)",
  "docs/audits/data/schema/ps3-nhl15.json#mHuy (exhibitiongoalieai)",
  "docs/audits/data/schema/ps3-nhl15.json#fMVl (exhibitiongoalieequipment)",
  "docs/audits/roster-relationships.md#player-companion-records-confirmed--11-via-shared-key-wbiz",
  "docs/audits/data/operation-matrix.csv#ps3,nhl15",
]
note = "MEASURED on this anchor by the named case (C0-REG1b); the skater/goalie label of each companion is EA's metadata table name, not an enum file. One-to-one: 4978 distinct keys in dSvy and in xmja, 556 in mHuy and in fMVl, none duplicated, all resolving to a bio row. The roster-relationships audit and operation-matrix.csv (create-skater / create-goalie / clone / delete on `ps3,nhl15`) are retained as corroboration."
[companion_rule.declared.value]
shared_key_field = "wBIz"
[[companion_rule.declared.value.companion]]
table = "dSvy"
cardinality = "one-to-one"
applies_when = "position-skater"
[[companion_rule.declared.value.companion]]
table = "xmja"
cardinality = "one-to-one"
applies_when = "position-skater"
[[companion_rule.declared.value.companion]]
table = "mHuy"
cardinality = "one-to-one"
applies_when = "position-goalie"
[[companion_rule.declared.value.companion]]
table = "fMVl"
cardinality = "one-to-one"
applies_when = "position-goalie"

# The 3-bit width and 0..7 range are measured in the snapshot. The code ASSIGNMENT is now MEASURED
# on this anchor too (C0-REG1b): the 556 bio rows that own rows in the metadata-named goalie
# companion tables all store 4 and nothing else; the 4978 that own skater companion rows store
# exactly {0, 1, 2, 3}; no row is unassigned. `defs/enums/position.toml` (an uncommitted
# `NHL Legacy default.db`, five named players) was NOT the source of the expected labels — EA's
# metadata table names were — and it agrees. What 0..3 mean individually is NOT established here.
[position_discriminator]
state = "established"
confidence = "measured"
provenance = [
  "crates/tdb-canonical/src/nhl15_ps3_tests.rs#position_codes_partition_the_bio_table_exactly_as_the_metadata_named_companions_do",
  "docs/audits/data/schema/ps3-nhl15.json#ubPc.vjla",
  "docs/audits/data/schema/ps3-nhl15.json#mHuy (exhibitiongoalieai)",
  "docs/audits/data/schema/ps3-nhl15.json#dSvy (exhibitionskaterai)",
]
note = "MEASURED on this anchor: goalie code {4} and skater codes {0, 1, 2, 3} partition the 5534 bio rows exactly as ownership of a row in the EA-named goalie / skater companion tables does. Codes 5..7 of the 3-bit field are stored on no row. The per-code labels of 0..3 (centre, wings, defence) are not established here and are not declared."
[position_discriminator.value]
table = "ubPc"
field = "vjla"
skater_codes = [0, 1, 2, 3]
goalie_codes = [4]
