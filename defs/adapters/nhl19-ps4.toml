# Target adapter — NHL 19, PlayStation 4 (gen8, little-endian, TDB v6). Schema `target-adapter/2`.
#
# Package C0-REG4 (2026-09-15). EVIDENCE-BACKED AND DELIBERATELY PARTIAL: 8 canonical properties
# over 10 physical fields, every number read from THIS target's committed snapshot
# (`docs/audits/data/schema/ps4-nhl19.json`) and every non-physical fact cited to an audit row,
# matrix row, named case or fixture that names NHL 19 on PlayStation 4. The gen7 adapters were
# STRUCTURAL references only (which blocks exist, in what shape); no value, transform, origin,
# sentinel rule, companion rule or capacity was carried from any of them — a shared field name or a
# matching layout is not semantic proof. Where a fact resembles a gen7 title's, the resemblance is
# measured here, not assumed — and the differences are real: on this anchor the main-team pointer
# `dXSB` sits at bit 1042 and is 10 bits wide (declared -1..1022), the ratings are 7-bit 0..99
# with NO offset, and the main DB itself carries `max_records > current_records`.
#
# ATTRIBUTION UNRESOLVED (C0-REG4-R1) — THIS FILE IS REGISTERED REPRESENTATION, NOT AN OPERATIVE
# TARGET ADAPTER. MEASURED DIRECTLY: `anchors/ps4/nhl19/databases/nhl_game.db` (sha256 265e4a68…) and
# `anchors/ps4/nhl19/databases/nhl_game-meta.xml` (text-identical, LF-normalised digest) are byte-identical to the
# files committed under NHL 20 on this platform — a DIFFERENT TITLE — and so are the four shared
# auxiliary databases of the two folders. Byte identity neither disproves either folder's label nor
# establishes it. The committed provenance was inspected (C0-REG4-R1): one commit (`e30b596`,
# 2026-06-27, "Add Xbox360 + PS4 anchors") added both folders with no per-title capture record; the
# anchors manifest lists both hashes without remark; the folder path, the generated snapshot label
# (`docs/audits/data/schema/ps4-nhl19.json`) and the tests that read that path are labels, not capture
# provenance; no title identifier is carried inside the database or the committed saves. NOTHING in
# this repository establishes which shipping build (if either) the shared bytes come from.
# Consequently EVERY block below is `state = "unknown"` with the measurement preserved as a
# `[*.candidate]` (confidence as measured on the bytes), every mapping is `blocked` with unresolved
# transforms, and no canonical API yields a usable NHL 19 mapping from this file
# (`human_range`, `scalar_editable` and `registry_population` report nothing established; case
# `nhl19_ps4::the_committed_nhl19_and_nhl20_anchors_are_byte_identical_so_neither_attribution_is_established`). The physical facts are FIXTURE FACTS about the bytes at this
# path; they promote together, and only, with an independent witness that the bytes are
# NHL 19's shipping database. No shipping identity is invented and neither anchor is replaced.
# The identity itself
# carries NO save capacity, deployment behaviour or runtime conclusion across targets, and nothing
# in this file rests on it: this adapter cites only this title's own paths and rendering.
#
# MEASURED DIRECTLY (C0-REG4): the main anchor `anchors/ps4/nhl19/databases/nhl_game.db` (sha256 265e4a68…)
# parses as a little-endian TDB v6 with 111 tables, header CRC and size valid. Capacities are read
# from THAT file's own directory (`main-db-max-records`) — the OBSERVED DIRECTORY CAPACITY, which is
# not a demonstrated runtime limit — and are NOT a substitute for the ROSTER save's own capacity.
# The ROSTER fixture this title commits (`anchors/ps4/nhl19/savefiles/RosterCustom0/DATA`) decodes through the
# committed production PS4 codec and its directory is COMPARED with the main anchor's as a separate
# measurement (`max_records` equal on all eight tables; populations DIFFERENT — an edited roster); that
# comparison is recorded in each capacity note and is not the source of any figure.
#
# Semantics are measured on this anchor by the named cases in
# `crates/tdb-canonical/src/target_ps4_tests.rs` (module `nhl19_ps4`), with expected labels taken from EA's
# metadata names and declared foreign keys — never from the enum or probe under test. Handedness
# stays blocked (no independently supported label exists here), the main-team parent table stays a
# candidate (containment plus a name is not a foreign key), and `team.name` is mapped to the field EA names `teamname` (`kOtt.AUsv`).
#
# The mapped set is a representative sample over the roster core and the team table; the unmapped
# remainder is a recorded gap, never an implied identity mapping. Adding this file does not make the
# target complete, supported or game-verified.
#
# Rules this file is validated against (crates/tdb-canonical): see the head of
# defs/adapters/nhl15-xbox360.toml — identical contract, `target-adapter/2`.
#
# Confidence, per fact:
#   measured — read directly out of committed evidence (the schema snapshot, an audit's table, a
#              matrix row for `ps4,nhl19`, a named case that lists this anchor or this fixture);
#   derived  — a measured fact on other material plus a stated argument that it carries here;
#   asserted — recorded from repository source/prose with a citation, not independently measured.

