# Target adapter — NHL 15, PlayStation 4 (gen8, little-endian, TDB v6). Schema `target-adapter/2`.
#
# Package C0-REG4 (2026-09-15). EVIDENCE-BACKED AND DELIBERATELY PARTIAL: 8 canonical properties
# over 10 physical fields, every number read from THIS target's committed snapshot
# (`docs/audits/data/schema/ps4-nhl15.json`) and every non-physical fact cited to an audit row,
# matrix row, named case or fixture that names NHL 15 on PlayStation 4. The gen7 adapters were
# STRUCTURAL references only (which blocks exist, in what shape); no value, transform, origin,
# sentinel rule, companion rule or capacity was carried from any of them — a shared field name or a
# matching layout is not semantic proof. Where a fact resembles a gen7 title's, the resemblance is
# measured here, not assumed — and the differences are real: on this anchor the main-team pointer
# `dXSB` sits at bit 48 and is 8 bits wide (declared -1..254), the ratings are 7-bit 0..99
# with NO offset, and the main DB itself carries `max_records > current_records`.

#
# MEASURED DIRECTLY (C0-REG4): the main anchor `anchors/ps4/nhl15/databases/nhl_game.db` (sha256 ae9d1d56…)
# parses as a little-endian TDB v6 with 148 tables, header CRC and size valid. Capacities are read
# from THAT file's own directory (`main-db-max-records`) — the OBSERVED DIRECTORY CAPACITY, which is
# not a demonstrated runtime limit — and are NOT a substitute for the ROSTER save's own capacity.
# The ROSTER fixture this title commits (`anchors/ps4/nhl15/savefiles/84f8102f - ROSTER/DATA`) is NOT decoded by the
# committed production PS4 codec (save-matrix: `unknown,unsupported`), so the save's own directory
# capacity is BLOCKED on this target; no new codec was written and no main-DB figure stands in for
# the save's.
#
# Semantics are measured on this anchor by the named cases in
# `crates/tdb-canonical/src/target_ps4_tests.rs` (module `nhl15_ps4`), with expected labels taken from EA's
# metadata names and declared foreign keys — never from the enum or probe under test. Handedness
# stays blocked (no independently supported label exists here), the main-team parent table stays a
# candidate (containment plus a name is not a foreign key), and `team.name` is mapped to the field EA names `fullname` (`kOtt.YmkJ`).
#
# The mapped set is a representative sample over the roster core and the team table; the unmapped
# remainder is a recorded gap, never an implied identity mapping. Adding this file does not make the
# target complete, supported or game-verified.
#
# Rules this file is validated against (crates/tdb-canonical): see the head of
# defs/adapters/nhl15-xbox360.toml — identical contract, `target-adapter/2`.
#
# Confidence, per fact:
#   measured — read directly out of committed evidence (the schema snapshot, an audit's table, a
#              matrix row for `ps4,nhl15`, a named case that lists this anchor or this fixture);
#   derived  — a measured fact on other material plus a stated argument that it carries here;
#   asserted — recorded from repository source/prose with a citation, not independently measured.

schema = "target-adapter/2"
adapter_version = 2
canonical_schema_version = 1
target = "nhl15-ps4"
generation = "gen8"
endian = "little"
tdb_version = 6
physical_snapshot = "docs/audits/data/schema/ps4-nhl15.json"

# 148 tables / 3093 fields exist in the snapshot; 10 physical fields are mapped here (the three
# birth-date components count individually). The field total is read from this target's own
# snapshot.
[coverage_declared]
tables_total = 148
fields_total = 3093
fields_mapped = 10
note = "Representative sample over the roster core and the team table. The unmapped remainder is UNKNOWN, not identity-mapped."

