class = "raster"
interchange = "rgba8"
retention = "unmodified"
description = "The colour raster of one skater helmet model. On Legacy the shipped `_tm` files are zone MASKS coloured at runtime from the team's `hHbv` record; the canonical source is the mask as authored, and Studio's preview compositor is not an authoring step."

[[canonical_source]]
role = "glove-texture"
class = "raster"
interchange = "rgba8"
retention = "unmodified"
description = "The colour/zone-mask raster of one glove model (`glove_{id}_*`)."

[[canonical_source]]
