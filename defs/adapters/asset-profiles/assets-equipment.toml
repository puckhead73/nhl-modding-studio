# Per-family asset output profile — player equipment (Q07a.1). Schema `asset-output-profile/5`.
#
# Package C0-AS6 (2026-09-16). REPRESENTATION, NOT ESTABLISHED COVERAGE. Every constraint block
# on every target is `unknown`; no operation's requirements are met; nothing here decides a Build.
# The file registers the equipment family against the existing contract from the evidence the
# repository already holds — the database half MEASURED on the committed anchor, the file half
# taken from repository source and one operator record — so the gap is enumerated in the
# contract's own terms and the next measurement has a block to promote.
#
# ---------------------------------------------------------------------------------------------
# WHAT "EQUIPMENT" IS ON THESE TITLES, AND WHY ONE PROFILE IS EIGHT SLOTS
#
#   A skater's equipment row (`xmja`) carries four asset ids and a goalie's (`fMVl`) four more,
#   each keying a SET of render files to a slot-specific filename grammar:
#
#     slot           DB field      folder under rendering/   file grammar (HEAD source)
#     stick          xmja.wXFx     playerstick               texlib_{id}
#     goalie stick   xmja.wXFx     goaliestick               goaliestick_{id}_{map}   (shares wXFx)
#     gloves         xmja.NmUR     glove                     glove_{id}_* / feglove_{id}_* / glove_{id} mesh
#     helmet         xmja.YUZp     helmet                    texlib_{id} / helmet_{id}_{v} / helmet_0_{id}_*_{map}
#     skates         xmja.AOOe     skate                     texlib_{id}   (mesh shared: playerskate_*)
#     blocker        fMVl.Kmxz     blocker                   blocker_{model}_{id}_* (2nd number)
#     trapper        fMVl.OTJR     trapper                   trapper_{model}_{id}_*  (2nd number)
#     pads           fMVl.mIUA     goaliepad                 goaliepad_{id}_*
#     goalie helmet  fMVl.JOlt     goaliehelmet              goaliehelmet_{style}_{id}_cm (paint design)
#
#   The contract carries ONE `[identity]` per target. Eight id sources cannot be spelled in it,
#   and no candidate value below pretends otherwise: `[identity]` stays unknown with the measured
#   facts in its note and the per-slot shape recorded as a SCHEMA GAP (like the portrait profile's
#   missing computed-directory token). This package does not extend the schema for it, because
#   nothing an extension would spell could become operative today — the file half of every slot is
#   unobserved in any committed record.
#
# ---------------------------------------------------------------------------------------------
# THE EVIDENCE THIS FILE RESTS ON
#
#   anchors/xbox360/nhllegacy/databases/nhlng.db + anchors/ps3/nhllegacy/databases/nhlng.db
#       MEASURED by the named case
#       crates/tdb-canonical/src/asset_coverage_tests.rs#legacy_equipment_id_fields_are_measured_on_the_anchor
#       (C0-AS6): the two main DBs are byte-identical (one SHA-256), so one measurement speaks for
#       the DB side of both Legacy platforms. The eight fields, their metadata names, bit widths
#       and stored value sets are in that case and summarised under [identity] below.
#   docs/audits/data/schema/xbox360-nhllegacy.json / ps3-nhllegacy.json   the committed snapshots
#       the case cross-checks the metadata names against.
#   crates/studio-domain/src/equipment_slots.rs#SLOT_SPECS (HEAD cc913f9)   repository source: the
#       filename grammar above, the per-slot `max_id` (127 / 255 / 511 — equal to the anchor's bit
#       widths on Legacy and NOT per-title: NHL 08 stores the stick in 8 bits and the other present
#       slots in 4–5, NHL 21 PS4 stores all of them in 10),
#       the FE createplayer thumbnail prefixes, and the statement that cloning an id "copies each
#       of its files byte-for-byte to the target ID's filenames. No DB edits". Source prose is
#       cited here as ASSERTED.
#   crates/studio-domain/src/equipment_texture.rs (HEAD)   repository source: glove/helmet `_tm`
#       files are ZONE MASKS painted from the team's `hHbv` zone colours — a database dependency of
#       the preview, recorded under [identity] as a reference, not an identity.
#   docs/audits/data/assets/nhllegacy/xbox360/capability.csv#equipment   one row: format "loose RX2
#       rasters (helmet/glove/blocker/trapper/goaliepad/goaliehelmet/goaliestick/playerstick)",
#       "texlib::replace_* on extracted .rx2; identify partial (brand-keyed) (2026-08-03)", install
#       = external. A write in a derived tree; no file is named.
#   docs/audits/data/assets/nhllegacy/xbox360/archives.csv#cacherender.big   the recorder's summary
#       line "rendering (stock logos texlib, players, equipment)".
#   defs/enums/stick-model.toml (committed operator record, NHL Legacy PS3)   the ONE file record
#       for this family on PS3: 106 `stick{N}.big` thumbnails under
#       `USRDIR/fe/ion/artassets/createplayer/sticks/` (ids listed), 74 `texlib_{N}.rpsgl` under
#       `USRDIR/rendering/playerstick/` (ids enumerated as the enum's entries), and a 2026-05-18
#       on-ice test: writing `xmja.wXFx = N` (with the NISO/jmjk/MMuu/FCNk cascade zeroed) to
#       `USRDIR/db/nhlng.db` renders the stick painted in `texlib_N.rpsgl`. Prose with counts and
#       id lists, no digests, no census artefact: cited as ASSERTED. It is nonetheless the only
#       record in this repository of any asset family's runtime binding being exercised in a game.
#   defs/enums/{glove,helmet,skate}-model.toml   operator catalog CSVs naming ids and models on
#       `xmja.NmUR` / `YUZp` / `AOOe`; they name NO file and are cited only for the field bindings.
#
# WHAT NONE OF IT IS: a census of equipment files with digests, a decode recorded with codec and
# size, a member listing of `cacherender.big`, a load test recorded as an artefact, or any record
# on a target other than the two NHL Legacy platforms (Recompiled is registered by reference).
# The mounted-tree case `legacy_x360_outfit_and_equipment_decode_from_extracted_tree` skips
# silently in CI (C0.2 §5.4 class) and is not evidence here.

schema = "asset-output-profile/5"
profile_version = 1
family = "assets-equipment"
note = """
Nothing on any target is established. Two targets are represented (NHL Legacy Xbox 360 and PS3)
and one is registered by reference (Legacy Recompiled, Q47). The database half of every slot is
measured on the committed anchor — eight id fields, their bit widths and the ids the vanilla
roster actually stores — and the file half rests on repository source, one unnamed extracted-tree
write and one operator record. Every block is unknown; the candidates carry the evidence at the
scope it actually has.
"""

[[canonical_source]]
role = "stick-texture"
class = "raster"
interchange = "rgba8"
retention = "unmodified"
description = "The painted stick artwork of one stick model (the `texlib_{id}` bundle's colour raster), lossless RGBA, retained unmodified."

[[canonical_source]]
role = "skate-texture"
class = "raster"
interchange = "rgba8"
retention = "unmodified"
description = "The colour raster of one skate model (`skate/texlib_{id}`)."

[[canonical_source]]
