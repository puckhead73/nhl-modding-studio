[target_profile.identity]
state = "unknown"
provenance = [
    "crates/tdb-canonical/src/asset_coverage_tests.rs#legacy_equipment_id_fields_are_measured_on_the_anchor",
    "docs/audits/data/schema/xbox360-nhllegacy.json#xmja",
    "docs/audits/data/schema/xbox360-nhllegacy.json#fMVl",
    "crates/studio-domain/src/equipment_slots.rs#SLOT_SPECS",
    "crates/studio-domain/src/equipment_texture.rs",
    "defs/enums/stick-model.toml",
]
note = """
The DB half is MEASURED on the committed anchor (`anchors/xbox360/nhllegacy/databases/nhlng.db`,
byte-identical to the PS3 anchor) by the named case (C0-AS6). Skater rows (`xmja`, 5 066 rows):
`wXFx` stick 7 bits, 19 distinct ids stored (35..112); `NmUR` gloves 7 bits, 14 distinct
(27..83); `YUZp` helmetbrand 8 bits, 10 distinct (1..25); `AOOe` skatebrand 7 bits, 8 distinct
(39..48). Goalie rows (`fMVl`, 566 rows): `Kmxz` blocker 7 bits, 29 distinct (11..82); `OTJR`
trapper 7 bits, 26 distinct (11..82); `mIUA` pads 7 bits, 29 distinct (11..82); `JOlt` maskid
9 bits, 173 distinct (0..290, 36 rows store 0). No field stores its all-ones pattern on any row,
and no null code is established for any of them (the 36 `maskid = 0` rows are a value until shown
otherwise). The HEAD `SLOT_SPECS` ceilings 127 / 255 / 511 equal `2^bits - 1` for these widths —
on Legacy; on NHL 08 the stick field is 8 bits wide and the other present slots 4–5, and on
NHL 21 PS4 all of them are 10 bits wide (see
docs/receipts/data/c0-as6-asset-db-references.csv), so the constants are Legacy facts carried as
code, not a per-title rule. The 19 stored stick ids are all among the 74 ids
`defs/enums/stick-model.toml` names as having a `texlib_N` texture — a consistency check between
two committed records, not a file observation.

The FILE half — that `texlib_{id}` / `glove_{id}_*` / `blocker_{model}_{id}_*` are the files a
row's id names — was repository source (HEAD `SLOT_SPECS`) until C0-AS7 applied that grammar to
the member table of `cacherender.big` (docs/receipts/data/c0-as7-x360-member-join.csv, re-derived by
crates/tdb-canonical/src/asset_census_tests.rs#legacy_x360_member_tables_join_to_the_anchor_and_the_join_record_matches):
for ALL EIGHT measured fields — stick, skate, helmet, glove, pad, mask-paint, blocker and
trapper — EVERY stored id names a member under its slot folder (19 / 8 / 10 / 14 / 29 / 173 /
29 / 26 ids), by literal member name, none decoded. A ninth comparison, the goalie-stick folder
against the `xmja.wXFx` field HEAD source claims it shares, FAILS: 38 member ids 6-43 against 19
stored ids 35..112, one in common — a finding about the shared-field claim, not a field failing. That is a
specimen observation on an attributable corpus; the capability row's `identify = partial
(brand-keyed)` still describes what Studio does.

WHY NO CANDIDATE VALUE: the contract carries one `[identity]` per target with one `source`, and
this family keys EIGHT slots to eight fields (nine grammars, the goalie stick sharing `wXFx`).
That is a schema gap, recorded here rather than papered over with a single `source` string; it
is not extended in this package because no slot's file half could make an extended identity
operative today. `ambiguity` is a Studio behaviour choice and is not proposed.

A further DATABASE DEPENDENCY, not an identity: HEAD `equipment_texture.rs` paints glove and
helmet `_tm` zone masks from the team's `hHbv` zone colours for the preview. A replacement of
such a mask changes what those colours land on; the Q06 review of an equipment write therefore
has a database reference to show even where the write itself touches no row.
"""

