`install = external`: the recorded write landed in an extracted tree through `import_texture`.
Two further shapes exist in HEAD source and neither is a committed observation of the game:
(a) the Hockey Shop keeps a per-slot store OUTSIDE the install (`studio_api::hockey_shop`,
`<store_root>/<store_dir>/store.json` + PNGs) and installs a store item by writing into a texlib —
a loose-file write; (b) cloning an equipment id "copies each of its files byte-for-byte to the
target ID's filenames. No DB edits" (`equipment_slots.rs`) — a whole-file loose write with
`updates_references = false`. No value is proposed: which of those paths a Build takes, and
whether the shipping archive rather than a loose tree is the destination at all, is undecided
and unmeasured. The committed EB archive-write capability (`EbFile::replace_payload*`) is not
wired to this family.
"""

[target_profile.runtime_lookup]
state = "unknown"
note = "What the game loads — an archive member of `cacherender.big`, a loose file a modder dropped beside it, or a patched copy — was not traced, disassembled or load-tested on this platform. Blocks `discover` and `install`."

