note = "PROPOSED, NOT OPERATIVE. `archive-member` under `cacherender.big` — MEASURED for the nine render slot folders by the member listing; a proposal for the target because the thumbnails are elsewhere and what the runtime reads is unobserved. Promoting it needs a per-family discovery in the contract or the thumbnail archive located, and `[runtime_lookup]`."

