# ---- the observed path shapes (repository source; no committed census names one file) ------
#
# `{numeric-id}` is the slot's equipment id from the field named in the family's note. `{variant}`
# stands for the ONE further component a declared template carries beside the id — the trailing
# map suffix (`cm`/`dm`/`tm`/`am`/`nm`/`sm`) on the per-map families, the mask style on the paint
# family; the contract has no token for either, and one stand-in is declared rather than inventing
# a vocabulary nothing observed. A token substitutes ONE value everywhere it appears, so a shape
# with two independent components beside the id — the helmet's `helmet_0_{id}[_{team}]_{map}`,
# the blocker's and trapper's `{prefix}_{model}_{id}_{map}` — CANNOT be spelled as a template
# (`helmet_0_15_am`, `blocker_1_80_nm` are unreachable by any substitution) and is left in prose
# on the nearest declared family until the schema has independently addressable tokens (C0-AS6
# review finding P2). `bucket_resolution` is unknown on every family because no committed record
# shows a rendered path names a real file.

[[target_profile.path_family]]
id = "stick-texlib"
template = "rendering/playerstick/texlib_{numeric-id}.rx2"
tokens = ["numeric-id"]
case = "lower"
bucket_resolution = "unknown"
note = "`{numeric-id}` = `xmja.wXFx`. One texture library per stick model (HEAD `SLOT_SPECS`, matcher `texlib_<id>`). The tape mesh `playersticktape_*` sits beside it and is not a raster."

[[target_profile.path_family]]
id = "skate-texlib"
template = "rendering/skate/texlib_{numeric-id}.rx2"
tokens = ["numeric-id"]
case = "lower"
bucket_resolution = "unknown"
note = "`{numeric-id}` = `xmja.AOOe`. The `playerskate_*` mesh is shared across ids and is excluded by the `texlib_` prefix (HEAD source)."

[[target_profile.path_family]]
id = "helmet-texlib"
template = "rendering/helmet/texlib_{numeric-id}.rx2"
tokens = ["numeric-id"]
case = "lower"
bucket_resolution = "unknown"
note = """
`{numeric-id}` = `xmja.YUZp`. This family carries the texlib alone. The helmet slot's OTHER shapes
(HEAD `SLOT_SPECS`, four further matchers) are NOT declared as templates because the contract
cannot spell them: `helmet_{id}_{v}` (no map suffix, id first), `helmet_0_{id}[_{team}]_{map}`
(map suffix, id in the SECOND numeric position behind a literal `0` and before an optional team
token — two independent components beside the id), `chinstrap_{id}_*` and `padding_{id}_*`. They
are recorded here in prose; see the block comment above.
"""

[[target_profile.path_family]]
id = "glove-map"
template = "rendering/glove/glove_{numeric-id}_{variant}.rx2"
tokens = ["numeric-id", "variant"]
case = "lower"
bucket_resolution = "unknown"
note = "`{numeric-id}` = `xmja.NmUR`; `{variant}` = the map suffix. A `feglove_{id}_*` sibling (front-end form) and a `glove_{id}` mesh share the id (HEAD source); one family is declared for the mapped textures."

[[target_profile.path_family]]
id = "goalie-stick-map"
template = "rendering/goaliestick/goaliestick_{numeric-id}_{variant}.rx2"
tokens = ["numeric-id", "variant"]
case = "lower"
bucket_resolution = "unknown"
note = "`{numeric-id}` = `xmja.wXFx` — the goalie stick SHARES the skater stick field; the engine picks the folder by position (HEAD source); `{variant}` = the map suffix. Per-map textures, no texlib; the two-token `goaliestick_{a}_{b}` mesh is excluded by an exact-token rule."

# The BLOCKER (`fMVl.Kmxz`) and TRAPPER (`fMVl.OTJR`) grammars — `blocker_{model}_{id}_{map}` /
# `feblocker_…` and `trapper_{model}_{id}_{map}` / `fetrapper_…`, the id in the SECOND numeric
# position behind a model number (HEAD `SLOT_SPECS`, `id_index = 1`) — carry two independent
# components beside the id and are NOT declared as templates (see the block comment above). Their
# fields are measured under [identity]; their files have no path family until the schema can
# address the model number and the map suffix separately.

[[target_profile.path_family]]
id = "goaliepad-map"
template = "rendering/goaliepad/goaliepad_{numeric-id}_{variant}.rx2"
tokens = ["numeric-id", "variant"]
case = "lower"
bucket_resolution = "unknown"
note = "`{numeric-id}` = `fMVl.mIUA`; `{variant}` = the map suffix. `fegoaliepad_` is the front-end sibling."

[[target_profile.path_family]]
id = "goalie-helmet-paint"
template = "rendering/goaliehelmet/goaliehelmet_{variant}_{numeric-id}_cm.rx2"
tokens = ["variant", "numeric-id"]
case = "lower"
bucket_resolution = "unknown"
note = "`{numeric-id}` = `fMVl.JOlt` (maskid), the second numeric token; the first is the mask style. Paint-design files only: the mask MESH ships as `helmet_{a}_{b}` plus `cage_{a}_{b}_{c}` and is not `goaliehelmet_*` (HEAD source)."

[[target_profile.path_family]]
id = "fe-thumbnail-stick"
template = "fe/ion/artassets/createplayer/sticks/stick{numeric-id}.big"
tokens = ["numeric-id"]
case = "lower"
bucket_resolution = "unknown"
note = "The create-player thumbnail of one stick id (HEAD `SLOT_SPECS.thumbnail_prefix`). The other slots follow the same shape under `createplayer/{gloves/gloves,helmet/helmet,skates/skates,blocker/blocker,trapper/trapper,pads/pads,mask/mask,sticks/goaliestick}{id}.big`; one family is declared because it is the one form a committed record (the PS3 operator record, see the PS3 profile) actually counts. Not observed in any Xbox 360 record."

