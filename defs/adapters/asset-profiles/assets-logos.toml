note = "Not examined on any crest file."

[target_profile.variant.tiling]
state = "unknown"
note = "Not examined. An XPR2 member on Xbox 360 may be tiled; nothing here says whether the crest is."

[[target_profile.variant]]
id = "rink-texlib"
note = "The in-rink art texlib. Selected by path family alone. The one committed specimen is of this form."

[[target_profile.variant.selector]]
dimension = "path-family"
equals = "rink-texlib"

[target_profile.variant.container]
state = "unknown"
note = "The specimen is a RenderWare `RW4` texture library holding several named rasters (`tdb_rx2::texlib::parse`). One specimen from a derived tree: recorded, not operative."

[target_profile.variant.container.candidate]
confidence = "measured"
scope = "specimen-observation"
corpus = "xbox360-compiled-tree"
provenance = ["docs/audits/data/assets/nhllegacy/xbox360/capability.csv#logos"]
note = "PROPOSED, NOT OPERATIVE. `texlib_10_0_0.rx2` parsed as an RW4 texlib, round-tripped losslessly and re-decoded after an edit. The outermost layer for this file inside the SHIPPING title is an `EB\\0\\3` archive member (see [container] at target level), which the extracted specimen cannot show."

[target_profile.variant.container.candidate.value]
