# ---- target-level blocks ------------------------------------------------------------------

[target_profile.discovery]
state = "unknown"
note = """
The only attributable placement evidence is a summary line: `cacherender.big` — "rendering (stock
logos texlib, players, equipment)". That is where the recorder says the texlibs sit inside the
shipping title; no member listing was committed to check it against, and no FE crest archive is
named at all. Extracted-tree placement (`rendering/logo/`, `fe/ion/artassets/teamlogos/`) is what
the code walks, and it is not archive placement.
"""

[target_profile.discovery.candidate]
confidence = "asserted"
scope = "specimen-observation"
corpus = "xbox360-shipping-archives"
provenance = ["docs/audits/data/assets/nhllegacy/xbox360/archives.csv#cacherender.big"]
note = "PROPOSED, NOT OPERATIVE. `archive-member` under `cacherender.big` for the rink texlibs, per the recorder's summary. Promoting it needs the archive's member table read and the logo members located by name — the FR14 item."

[target_profile.discovery.candidate.value]
scope = "archive-member"
root = "cacherender.big"
recursive = true

[target_profile.identity]
state = "unknown"
provenance = [
    "docs/audits/data/assets/nhllegacy/xbox360/identities.csv",
    "crates/studio-domain/src/assets.rs#legacy_x360_team_logo_identity_map",
    "crates/studio-domain/src/assets.rs#decode_team_logo",
]
note = """
Half measured, half asserted, and the block needs both. MEASURED on the committed anchor: the team
row's `kOtt.lOnr` (`artid`) is a sparse id space reaching past the 252 records, distinct from the
key, with the Red Wings row carrying 10 — `legacy_x360_team_logo_identity_map` generates
identities.csv from the anchor and asserts exactly that. ASSERTED: that `t{artid}.big` and
`texlib_{artid}_0_0.rx2` are the files that id names — repository source prose ("verified against
the real install"), with no committed record of the check. `ambiguity` is a Studio behaviour
choice and is not proposed here.

What would be proposed — key `numeric-id`, source `kOtt.lOnr`. No value is carried because `IdentityValue.ambiguity` would have to be invented. To promote: a committed record tying at least the specimen's id to its row and its file, and a decision on the ambiguity policy. — is left in prose rather than as a `[candidate]`: the contract requires a candidate to carry a value table, and the value's `ambiguity` field cannot be filled without inventing a Studio behaviour choice.
"""

[target_profile.container]
state = "unknown"
note = """
Carried by the variants for the inner layers (BIGF/XPR2 for the crest, RW4 for the texlib). The
OUTER layer inside the shipping title — an `EB\\0\\3` archive with 16-byte file-table entries —
is what the attributable corpus shows for every one of its 13 archives, but which archive holds
which logo is the summary line again. Declaring the outer layer at target level while the inner
chain differs per variant would also collide with the variants deciding [container]; the contract
allows exactly one level to decide it, and the inner chain is the one the specimen supports.
"""

[target_profile.path_rule]
state = "unknown"
note = "Both families carry `bucket_resolution = \"unknown\"`, and the rule cannot be established through an unresolved family. The `_0_0` suffix of the texlib family is itself unresolved (the code tries three spellings)."

[target_profile.raster]
state = "unknown"
note = "Carried by the variants."

[target_profile.dimensions]
state = "unknown"
note = "Carried by the variants."

[target_profile.mipmaps]
state = "unknown"
note = "Carried by the variants."

[target_profile.tiling]
state = "unknown"
note = "Carried by the variants."

[target_profile.compression]
state = "unknown"
note = """
Two layers, neither established. Inside the shipping archives, compressed payloads on this EB
variant are `chunklzx` (LZX), which Studio does not decode — so no archived logo's wrapper has been
read. Inside the FE crest's BIGF, the portrait chain's member is RefPack; that is the crest's by
analogy only. The extracted texlib specimen carried no stream wrapper, which is a fact about the
extracted file.
"""

[target_profile.compression.candidate]
confidence = "asserted"
provenance = [
    "crates/tdb-archive-big/src/eb.rs#decode_payload",
    "docs/audits/data/assets/nhllegacy/xbox360/archives.csv",
]
note = "PROPOSED, NOT OPERATIVE: `lzx` for archived members on this EB variant, per the reader's own documentation of the payload magics it meets (`chunkzip` / `chunklzx`). No logo member was opened."

[target_profile.compression.candidate.value]
payload = "lzx"
deterministic = false

[target_profile.atlas]
state = "unknown"
note = "A rink texlib holds a wordmark plus crest slots — several rasters in one library — so one FILE carries more than one asset; whether one SURFACE does was not examined. Neither `sharing` value is supported by a committed record."

[target_profile.install]
state = "unknown"
note = """
`install = external` in the capability record means the verified write landed in an extracted
tree, through `studio_api::registry::import_texture` (safe-join, one-time `.bak`). No shipping
archive was written for this family. The repository DOES hold an archive-level write capability
for EB archives — `tdb_archive_big::eb::EbFile::replace_payload_in_place` / `replace_payload`,
committed, verified against a PS4 `data0.big` (Phase 5.4) — and it is not wired to this family,
and the per-entry `+12` checksum it preserves verbatim is unidentified. No value is proposed: the
kind depends on which of those paths a Build takes, and that is undecided.
"""

[target_profile.runtime_lookup]
state = "unknown"
note = "What the game loads — an archive member, the extracted file a modder dropped beside it, or a patched copy — was not traced, disassembled or load-tested. Blocks `discover` and `install`."

