# ---- the three co-existing portrait forms ------------------------------------------------

[[target_profile.variant]]
id = "playerheads-512x512"
note = """
Selected by path family AND stored dimensions, because the two `playerheads` forms co-exist inside
one folder and NOTHING observed separates them by path. A query that supplies only the family is
therefore ambiguous between this variant and `playerheads-512x256`, and selection refuses it. That
refusal is the honest answer, not a gap to be closed by preferring one.
"""

[[target_profile.variant.selector]]
dimension = "path-family"
equals = "playerheads"

[[target_profile.variant.selector]]
dimension = "stored-dimensions"
width = 512
height = 512

[target_profile.variant.raster]
state = "established"
confidence = "measured"
scope = "inspected-corpus-invariant"
force = "observed-source-format"
corpus = "ps3-installed-copy"
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/c0-por1-r1-evidence-scope.md",
    "docs/receipts/data/c0-por1-census.json",
]
derivation = """
`ddspf.dwFourCC` is `DXT5` on all 18 663 files of this copy — current and backup-labelled alike —
with `dwPitchOrLinearSize` matching the payload exactly. The invariance across BOTH groups is what
makes this a corpus invariant rather than a group-conditional claim, and selecting a subset of that
corpus by path family and stored size does not weaken an invariant that holds over all of it.

The channel set follows from the codec. NOT a target requirement: no load test shows the game
rejects another codec, which is why `force` is `observed-source-format`.
"""

[target_profile.variant.raster.value]
codec = "dxt5"
channels = ["r", "g", "b", "a"]

[target_profile.variant.raster.property.color_space]
state = "unknown"
reason = "The `DDS` header does not record a colour space at all, so there is nothing to read. C0-POR1 filled this with a guessed `srgb` to make the bundled value well-formed; R1 removed it."
scope = "inspected-corpus-invariant"
provenance = ["docs/receipts/c0-por1-r1-evidence-scope.md"]

[target_profile.variant.raster.property.alpha]
state = "unknown"
reason = "Only a SPECIMEN OBSERVATION exists: three PS3 files were decoded and carry texels whose colour channels exceed alpha, which is inconsistent with premultiplication in those three files. Three files by one decoder is not a target-wide alpha mode."
scope = "specimen-observation"
confidence = "measured"
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/c0-por1-r1-evidence-scope.md",
]
candidate_value = "straight"

[target_profile.variant.dimensions]
state = "unknown"
note = """
Measured on every file, and still unknown — because establishing it HERE would be circular. This
variant is selected BY its stored dimensions, so reporting those dimensions as a finding about the
variant is the same defect R1 caught in `[mipmaps]`: a group defined by a property, and then that
property reported as the group's invariant.

What is observed, without provenance attached: 6465 current + 102 backup-labelled files at 512x512
in `playerheads`. Full per-group counts in docs/receipts/data/c0-por1-census.json.

Q10 makes this load-bearing: a release replacement must preserve original dimensions, so `replace`
stays blocked on this variant.
"""

[target_profile.variant.mipmaps]
state = "unknown"
note = """
WITHDRAWN BY R1 and not reinstated. C0-POR1 established `policy = "none"` by measuring the subset it
had already labelled "vanilla" — a subset DEFINED by carrying no mip chain. The underlying corpus is
not invariant: of 18 457 current files, 206 carry mip chains (counts 9, 10 and 1). Separating
EA-authored from third-party-authored files needs provenance evidence this package does not have.
"""

[target_profile.variant.tiling]
state = "unknown"
note = "The corpus invariant is that the container is `DDS `, which [container] already carries. That the PAYLOAD is linear rests on three specimen decodes, and a DDS file can carry console-swizzled data, so the container does not settle it."

[target_profile.variant.tiling.candidate]
