# Per-family asset output profile — player portraits (Q07a.1).
#
# A profile says how a canonical source asset becomes the bytes ONE target consumes. Canonical
# sources stay non-destructive and high fidelity; everything here is a derivation recipe, and a
# derived output is a reproducible artefact, never canonical Project data.
#
# THIS FILE STATES FORMAT CONSTRAINTS ONLY. It carries no key in which a converter, a support level
# or an operation result could be recorded. `[[target_profile.operation]]` says which format facts
# an operation would need, NOT that Studio performs it. Implementation status lives in the evidence
# system, and no profile can declare `game-verified` — the vocabulary has no such term.
#
# ---------------------------------------------------------------------------------------------
# HISTORY, IN ORDER, BECAUSE THE NUMBERS HERE HAVE MOVED THREE TIMES
#
#   C0-AS1     re-authored the file from `asset-output-profile/1` prose. NOTHING established: the
#              only portrait source in the repository was an operations CSV, which is `asserted`.
#   C0-POR1    read bytes from three supplied private copies and promoted 14 blocks on 3 targets.
#   C0-POR1-R1 found most of those over-scoped and cut them to 3, on one target.
#   C0-AS3     Schema `asset-output-profile/3`. It does not re-measure anything: it represents what
#              POR1/R1 already recorded at the scope that evidence actually has, which `/2` could
#              not express without over-claiming.
#   C0-AS5     Schema `/5`; `legacyrecomp-recomp` registered by reference (Q47).
#   C0-AS6     this revision (profile_version 5). MEASURES the database half of `[identity]` on
#              the committed anchors of all three declared targets and carries it as a CANDIDATE
#              on each (`ubPc.lOnr`, with the collisions the anchor actually stores). Establishes
#              nothing: the census holds id RANGES, not ids, so no anchor id was placed beside its
#              file. See docs/receipts/c0-as6-asset-family-coverage.md.
#   C0-AS7     this revision (profile_version 6). MEASURES the FILE half on `nhllegacy-ps3`: a
#              per-id census of the same installed copy (18 663 files, each hashed) joined to the
#              anchor, and `patch.big` at that copy's USRDIR root opened through the committed EB
#              reader. The join does NOT support promoting `[identity]`: 4 500 of the 5 449 non-zero
#              anchor ids have a loose current `playerheads` file and 949 do not (350 outside the
#              observed regular ranges, 599 inside them); `patch.big` supplies 33 of the 949. The
#              candidate stays a candidate with the join cited. `[discovery]` and `[runtime_lookup]`
#              stay unknown: `patch.big` is now READ — 83 portrait members at the same relative
#              paths as the loose tree, 23 of them colliding with a loose file of different content —
#              and which copy the game loads is still not observed. On `nhllegacy-xbox360` the two
#              render archives were listed and hold no `fe/ion/artassets` member; the other eleven
#              shipping archives were not opened. See docs/receipts/c0-as7-asset-evidence-measurements.md.
#
#   docs/receipts/c0-por1-portrait-measurements.md   (measurements, with an appended corrections log)
#   docs/receipts/c0-por1-r1-evidence-scope.md       (the correction, and the rules used below)
#   docs/receipts/c0-as3-scoped-asset-variants.md    (this schema revision)
#
# ---------------------------------------------------------------------------------------------
# THE THREE EVIDENCE LEVELS, NOW STRUCTURAL RATHER THAN PROSE
#
# `/2` had one axis — measured/derived/asserted — which says how well something was measured and
# nothing about what population the measurement covers. Every block below carries TWO more keys:
#
#   scope   specimen-observation        named specimens only. NEVER establishes a block.
#           inspected-corpus-invariant  holds for every file inspected in the cited corpus, across
#                                       ALL of its groups. A property that holds only inside a group
#                                       DEFINED by that property is circular, not invariant.
#           supported-target-constraint what the target itself requires. NOTHING here reaches this:
#                                       no load test, no acceptance test, no shipping-manifest check
#                                       was performed on any target.
#
#   force   observed-source-format      this is what the inspected source CARRIES. It authorises
#                                       reproducing that value and nothing else. It does not prove
#                                       another format is forbidden, and does not prove one is
#                                       supported. EVERY established block below is this one.
#           target-required             the target requires it; another value is refused. Unused
#                                       here, and unusable: it needs a supported-target-constraint.
#
#   corpus  the [[corpus]] the fact rests on. A block established on a corpus that is not
#           attributable to the target is refused by `asset-corpus-attribution-unsupported`.
#
# ---------------------------------------------------------------------------------------------
# WHAT EACH TARGET'S CORPUS PERMITS
#
#   nhllegacy-ps3     an OBSERVED INSTALLED COPY — this title's own directory layout, identity from
#                     its own PARAM.SFO. The only corpus here attributable to its target, and so the
#                     only target with anything established. It is NOT established to be pristine:
#                     it carries third-party writes, no shipping manifest was checked, and
#                     `patch.big` at USRDIR root was never opened.
#   nhllegacy-xbox360 a DERIVED `_compiled` tree beside the title's shipping archives. Not
#                     attributable. Its measurements are exhaustive and are candidates anyway —
#                     because of what the tree is, not how much was measured.
#   nhl21-ps4         an EXTRACTED tree (`databigs\Extracted\...`). Same position.
#
# ---------------------------------------------------------------------------------------------
# WHAT `/3` LET THIS REVISION STOP MISREPRESENTING
#
#   CORRELATED VARIANTS. NHL Legacy carries three portrait forms at once — 512x512 and 512x256
#   inside `playerheads`, 256x128 in `playerheadssmall`. `/2` held ONE dimension per target, so
#   `dimensions` had to be left unknown with the distribution written in a note. `/3` carries them
#   as `[[variant]]` entries whose dimensions, codec, mip layout and tiling stay together, selected
#   by structured clauses. There is no per-target list of allowed sizes or allowed codecs, so no
#   unobserved pairing is spellable.
#
#   PARTIAL VALUES. `/2` bundled {codec, color_space, channels, alpha} into one `raster` value, so
#   an unmeasurable colour space blocked the whole block — and C0-POR1 filled it with a guess to
#   make the bundle well-formed. Here `codec` and `channels` are established while `color_space` and
#   `alpha` are absent, each with its own `[raster.property.<name>]` reason. `preview` requires
#   `raster.codec`, so the unknown colour space blocks only what actually needs it.
#
#   ATLAS. `/2` recorded `kind = "none"` off a count of one texture payload per archive. That count
#   establishes that no surface is SHARED between assets; whether the family is an atlas, a pool or
#   neither is a further question about page geometry and slot addressing it does not answer. `/3`
#   records `sharing = "per-asset-surface"` and leaves `kind` unknown, so `replace` — which requires
#   `atlas.kind` — stays blocked.
#
#   CONTAINER AND COMPRESSION, RESCOPED. Both were `established` under `/2` with no way to say what
#   that meant for a Build. They are still established, now explicitly at `observed-source-format`:
#   reading `BIGF` and RefPack on every file establishes what those files ARE. A Build may reproduce
#   them; a Build proposing something else is BLOCKED, not refused, because nothing here shows the
#   game would reject it.
#
#   PATHS. The two path families and their observed bucket membership are first-class data instead
#   of prose. `bucket_resolution = "unknown"` says the authoritative id-to-directory rule is not
#   known, and `[path_rule]` cannot be established through an unresolved family. C0-POR1 wrote that
#   the rule "is not the literal folder-name ranges"; R1 withdrew that as a rule, and nothing here
#   reinstates it.
#
#   RUNTIME LOOKUP. New block, unknown on every target. Observed file placement in one installed
#   copy is not evidence of what the GAME loads. C0-AS7 opened `patch.big` on the PS3 copy (it
#   carries 83 portrait members beside 8 localization databases and 328 `rendering/` members);
#   what the runtime does with a member that also exists loose was not traced, so the block
#   still blocks `discover` and `install` everywhere.
#
# COVERAGE. One family, three declared target profiles and one by reference (`legacyrecomp-recomp`
# reuses `nhllegacy-xbox360`, C0-AS5 / Q47). Six established constraints: four on
# `nhllegacy-ps3` at target level and in one of its variants, none anywhere else. C0-AS6 adds a
# measured identity CANDIDATE on each declared target and establishes nothing further. See
# docs/validation/c0-06-canonical-project-and-adapters.md.

schema = "asset-output-profile/5"
profile_version = 6
family = "assets-portraits"
note = """
Everything established here is established at `observed-source-format`, on one target, over one
observed installed copy. Nothing on any target reaches a demonstrated target requirement: no load,
acceptance or shipping-manifest test was performed anywhere, so nothing in this file authorises
refusing a Build a different format — only reproducing the one that was observed.
"""

[[canonical_source]]
role = "portrait"
class = "raster"
interchange = "rgba8"
# Q14: portrait library inputs arrive already normalized to a consistent composition/background
# state, and Studio must not recrop, reframe, remove backgrounds or apply style treatment. The
# target adapter scales and encodes; it does not compose.
retention = "normalized-input"
description = "A lossless RGBA source image at the highest available resolution, retained unmodified by Studio."

# =================================================================== NHL Legacy, PS3

[[target_profile]]
target = "nhllegacy-ps3"
note = """
The only target here with anything established, and the reason is provenance rather than volume of
measurement: its corpus is the title's own installed directory. See [[corpus]] below for what that
does and does not mean.
"""

[[target_profile.corpus]]
id = "ps3-installed-copy"
kind = "observed-installed-copy"
attribution = "attributable-to-target"
build_identification = "incomplete"
identity_source = "the copy's own PARAM.SFO (TITLE `NHL Legacy`, TITLE_ID `BLUS31540`), whose title id matches the one recorded at crates/studio-domain/src/discovery.rs:48"
inspected_files = 18663
groups = ["current", "backup-labelled"]
limitations = [
    "A title id plus an SFO version field is not a build: no patch level, disc revision or executable build string was established.",
    "Not established to be pristine or complete. The copy carries third-party writes: 206 backup-labelled `.bak` files and 206 current files carrying mip chains where the rest carry none.",
    "Neither a `.bak` sibling nor a zero mip count establishes who wrote a file. Groups are named neutrally — current / backup-labelled — and no provenance is attached to either.",
    "No shipping manifest was checked, and `patch.big` at USRDIR root was never opened, so nothing rules out that it shadows or supersedes these loose files.",
    "\"Accepted by the inspection parser\" means the C0-POR1 parser found the fields it looks for at the offsets it expects. It is not semantic validation and does not establish that any file is well-formed for the game.",
]
provenance = [
    "docs/receipts/c0-por1-portrait-measurements.md",
    "docs/receipts/c0-por1-r1-evidence-scope.md",
    "docs/receipts/data/c0-por1-census.json",
]

[[target_profile.path_family]]
id = "playerheads"
template = "fe/ion/artassets/playerheads/{variant}/p{numeric-id}.big"
tokens = ["variant", "numeric-id"]
case = "lower"
bucket_resolution = "unknown"
note = """
`{variant}` stands for the bucket directory, and `bucket_resolution = "unknown"` records that NOTHING
computes it. The [[observed_bucket]] entries below record that the directory was seen and point at
the census that holds which ids were seen inside it; that is membership, and it is not a function.
Since C0-AS7 that census is the committed PER-ID record of this copy (one row per file: bucket,
name, label, id, size, SHA-256, and the BIGF member table's texture-member sizes), which supersedes
the C0-POR1 range summary the entries cited before; the ranges it shows are the same
(`p0_4000` 1-3999, `p4001_8000` 4001-7998, `p8001_12000` 8003-12401, `silhouettes` 60000-60003).
C0-POR1 turned the mismatch between `p8001_12000` and the ids inside it into the finding "the rule
is not the literal folder-name ranges"; R1 withdrew that, because no candidate rule was ever
formulated or tested. A folder label is not evidence of the rule behind it.

C0-AS3-R1 moved the id ranges themselves out of this file and into the census reference above. A
column of ranges sitting in a profile reads as a lookup table however it is labelled, and the next
reader resolves id 500 with it. The reference names a fixed document by digest instead, and anyone
who needs the membership finds it there, where it is recorded as an observation.
"""

[[target_profile.path_family.observed_bucket]]
directory = "p0_4000"
census = "docs/receipts/data/c0-as7-ps3-portrait-census.csv"
census_digest = "46cb5f1c1dde59d3c1b2ef20552987dd562564ddd60f5c78e9c13b92da3b2732"
scope = "inspected-corpus-invariant"
corpus = "ps3-installed-copy"

