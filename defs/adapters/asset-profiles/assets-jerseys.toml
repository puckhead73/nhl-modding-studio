# ---- the declared reading order over those families (`/4`) ----------------------------------

[[target_profile.resolution_chain]]
id = "kit-thumbnail"
purpose = "read-write"
note = """
The order the working-tree thumbnail code reads: the kit's own file, then the three shared
defaults. Declared read-write so the `/4` write rule is visible on it: a write resolves ONLY the
owned step (`fe-thumbnail`) — never a shared step, whatever a read found, and never a rendered
path that equals any shared step's once separators are normalised; a path that differs from a
shared one only in case is refused as undetermined, because declared casing is a rendering rule
and says nothing about the destination's case sensitivity (C0-AS4-CLOSE). It
creates a missing owned file only for the one shape the resolver can describe end to end: a
`loose-file` [install] with [container] decided absent and no reference to update (C0-AS4-R1);
a described archive install or container format, or an `updates_references` install, is reported
as unsupported creation, not implied support. Chain order is a declared reading order; it is NOT
evidence of the game's lookup, which stays with [runtime_lookup].
"""

