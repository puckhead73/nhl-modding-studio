C0-AS4 (`/4`) carries the proposal as a candidate with a value: key `composite`, built from the
three fields below, `ambiguity = "reject"` — the contract's own rule that an ambiguous match is
never bound silently, which the measured collisions make a live case rather than a hypothetical.
C0-AS7 placed every rendered id beside a real member: all 698 name a `texlib_` member of
`nocacherender.big`, a `name_..._cm` member there, and a `sock_..._cm` member of `cacherender.big`
(join record cited on the candidate). It stays a candidate because the value bundles an
`ambiguity` policy that is a Studio behaviour choice, because 207 bundle members carry ids no row
stores (so the file set is larger than the id set and the rule that assigns those is unobserved),
and because D7 is undecided.
"""

