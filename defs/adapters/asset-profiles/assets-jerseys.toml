[target_profile.identity]
state = "unknown"
provenance = [
    "docs/audits/data/schema/xbox360-nhllegacy.json#xjgw",
    "docs/audits/data/schema/xbox360-nhllegacy.json#kOtt.Rrgs",
    "crates/studio-domain/src/assets.rs#export_team_outfits",
    "crates/studio-domain/src/team_tabs.rs#JERSEYS_TABLE",
]
note = """
The DB half is MEASURED in the committed snapshot: a kit is an `xjgw` row keyed by team
(`mCXg`), carrying `GDQL` teamartid, `cVLR` style and `FccT` variant, which together are the
composite id the file names use — with `kOtt.Rrgs` (font), `Kacu` / `tftz` / `nfzw` (jersey /
pants / sock style) and `Dwps` / `gNjt` (back home / away) as further team-level references. The
file half — that `texlib_{style}_{art}_{variant}` is the bundle a row names — is repository
source exercised by synthetic naming tests (`outfit_output_name…`), not a committed observation
of a real file beside its row. `ambiguity` is a Studio behaviour choice and is not proposed.

What would be proposed — key `composite`, source `xjgw.cVLR + xjgw.GDQL + xjgw.FccT` (by `xjgw.mCXg` team). No value is carried because `IdentityValue.ambiguity` would have to be invented and because decision D7 has not assigned the `uniforms` rows to this family. — is left in prose rather than as a `[candidate]`: the contract requires a candidate to carry a value table, and the value's `ambiguity` field cannot be filled without inventing a Studio behaviour choice.
"""

