[target_profile.atlas]
state = "unknown"
note = "A bundle carries body, font sheet and (on some titles) pants as separate named rasters: one FILE, several assets, and whether any SURFACE is shared between kits was not examined. The font sheet is itself a glyph atlas (`fontAtlas.ts` cell layout) — an atlas INSIDE one canonical role, which `[atlas]` describes for the family as a whole and cannot describe per role."

[target_profile.install]
state = "unknown"
note = """
`install = external`: the recorded write landed in an extracted tree through `import_texture`.
Two facts a kit install needs have no field: (a) the shared fallback thumbnails (`custom*.big`)
must never be written by a per-kit replace — gap 2 — and (b) an "Add New Jersey" is a DB row
(`xjgw`) plus cloned files, which is `updates_references` in the other direction (the files
follow the row). Both (a) and (b) are exercised only by WORKING-TREE code (`jersey_thumbnail`,
`clone_kit_textures`, an `xjgw` clone in `workspace.rs`) that is not at baseline 52a12fd. The
committed EB archive-write capability (`tdb_archive_big::eb::EbFile::replace_payload*`) is not
wired to this family.
"""

[target_profile.runtime_lookup]
state = "unknown"
note = "What the game loads was not traced or load-tested. For the thumbnail the game's own fallback chain (`jersey_{id}.big` -> `custom.big` -> `customhome.big` -> `customaway.big`, per working-tree source) is a lookup rule the contract cannot carry (gap 2); it is recorded here so it is not lost."

