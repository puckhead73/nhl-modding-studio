]
note = """
PROPOSED, NOT OPERATIVE. MEASURED on the committed anchor `anchors/xbox360/nhllegacy/databases/nhlng.db`
by the named case (C0-AS4): `xjgw` has 703 rows; `cVLR` (style, 1 bit) stores 0..1, `GDQL`
(teamartid, 15 bits) stores 0..421, `FccT` (variant, 5 bits) stores 0..20; neither field wider
than one bit stores its all-ones pattern (the 1-bit style's all-ones is its value 1); rendering `{style}_{art}_{variant}` for every row gives 698 distinct ids — the
tuples `1_19_3`, `1_21_4` and `1_255_0` are each shared by two or four rows (teams 19/216, 21/217,
220/221), so the id is NOT unique and rows do not map one-to-one to files; `GDQL` equals the row's
own team's `kOtt.lOnr` on all 703 rows; the nine rows with `GDQL = 0` are the nine rows of team key
0, whose `lOnr` is 0 — a value. `scope = specimen-observation` and the shipping-archive corpus are
named because the measurement was of the database bytes; C0-AS7 added the file side on the same
corpus — every rendered id names a `rendering/jersey/texlib_{id}.rx2` member of `nocacherender.big`
(905 members over 698 ids plus 207 ids no row stores), by literal member name, none decoded.
`confidence = measured` describes both measurements. Still not promoted: the value's `ambiguity`
is a policy, D7 is undecided, and a member listing is not the runtime's lookup.
"""

