# --- ratings: the skater companion's 6-bit cells under the gen6 regime ---------------------------
# MEASURED on this anchor (C0-REG5): no 6-bit field on `dSvy` (21 fields) or `mHuy` (16 fields) stores a
# value above 49; `p_speed` spans 2..49. The ratings-write-codec audit's regime table names
# **NHL07 gen6** under offset 50 by title, the production probe (`sixbit_rating_offset`) resolves 50
# on these bytes by its own rule, and the named gen6 case asserted both on the byte-identical
# research copy. The three sources agree; the offset-36 regime of NHL 10 -> Legacy is a different
# row and was not carried here. No field on this snapshot is named for an overall (see the omission).

[[mapping]]
canonical = "player.rating_speed"
table = "dSvy"
field = "qPWY"
read_transform = "offset+50"
write_transform = "offset-50"
inverse_verified = true
confidence = "derived"
qualification = "implemented"
automated_case = "studio_domain::ratings_write_codec"
provenance = [
  "docs/audits/ratings-write-codec.md",
  "crates/studio-domain/tests/ratings_write_codec.rs#ratings_write_is_inverse_of_read_gen6",
  "crates/studio-domain/src/view.rs#sixbit_rating_offset",
  "docs/audits/data/schema/xbox360-nhl07.json#dSvy.qPWY",
  "crates/tdb-canonical/src/target_early_tests.rs#nhl07_xbox360::the_gen6_six_bit_rating_regime_resolves_offset_50_on_this_anchor",
]
note = "That `dSvy.qPWY` is the stored speed rating is DERIVED from the field's EA metadata name `p_speed` in this snapshot. The gen6 6-bit regime resolves edit_offset 50 on this anchor (measured maximum 49 over every 6-bit skater and goalie field; the audit names NHL07 gen6 under 50; the probe's rule yields 50). The named case `ratings_write_is_inverse_of_read_gen6` ran on `anchors/ps3/nhl07/databases/NHL07NG.db` — the research copy, whose bytes are identical to this anchor's — and asserted a resolved offset of 50 with a byte-identical write-back; it reads a skater's first rating cell rather than this field specifically, so the mapping is `implemented`, not `automated-tested`. The human range 50..113 is DERIVED by the validator from the transform and the storage range — it is never declared; the audit's stated scale is 50..99."

[mapping.storage]
state = "established"
confidence = "measured"
