# Target adapter — NHL 07, Xbox 360 (gen6, big-endian, TDB v6). Schema `target-adapter/2`.
#
# Package C0-REG5 (2026-09-15). EVIDENCE-BACKED AND DELIBERATELY PARTIAL: 8 canonical properties
# over 9 physical fields, every number read from THIS target's committed snapshot
# (`docs/audits/data/schema/xbox360-nhl07.json`) and every non-physical fact cited to an audit row,
# matrix row, named case or fixture that names NHL 07 on Xbox 360. The later-generation
# adapters were STRUCTURAL references only (which blocks exist, in what shape); no field identity,
# origin, transform, sentinel rule, companion rule or capacity figure was carried from any of them —
# a shared field name or a matching layout is not semantic proof. Measured here instead: the gen6 table model is its own: no equipment companions (`xmja` / `fMVl` do not exist), a thin `exhibitionteams` index whose names live on `stockteamtable`, 1280-bit name fields, a 7-bit main-team pointer and a 6-bit year.
#
# MEASURED DIRECTLY (C0-REG5, not inherited): `anchors/xbox360/nhl07/databases/NHL07NG.db` (sha256 67a00bea…) and
# `anchors/xbox360/nhl07/databases/NHL07NG-meta.xml` (text-identical, LF-normalised digest) are byte-identical to
# the NHL 07 PS3 research copy's files. That identity is stated as an observation about four files; it
# carries NO save capacity, deployment behaviour or runtime conclusion across targets, and nothing
# in this file rests on it: this adapter cites only Xbox 360 files — and the research copy is what it is, a copy, not a second capture.
#
# MEASURED DIRECTLY (C0-REG5): the main anchor `anchors/xbox360/nhl07/databases/NHL07NG.db` (sha256 67a00bea…)
# parses as a big-endian TDB v6 with 90 tables, header CRC and size valid, PACKED on every table.
# The committed ROSTER fixture (`anchors/xbox360/nhl07/savefiles/ROSTER1/ROSTER1`) decodes through the
# committed codec to a small TDB holding none of the roster-core tables, and the rest of the
# container is not decoded: the save capacity is BLOCKED on this target (no codec research was
# done), and the packed main DB is NOT read off as a substitute.
#
# Semantics are measured on this anchor by the named cases in
# `crates/tdb-canonical/src/target_early_tests.rs` (module `nhl07_xbox360`), with expected labels taken from EA's
# metadata names and declared foreign keys — never from the enum or probe under test. Handedness
# stays blocked (no independently supported label exists here), the main-team parent table stays a
# candidate, no absence code is established for the as-is main-team pointer, and `team.name` is mapped to `stockteamtable.fullname` (`HqzU.YmkJ`), reached from the thin `kOtt` index through `(table, teamid)` — a join the contract cannot state as a block.
#
# The mapped set is a representative sample over the roster core and the team table; the unmapped
# remainder is a recorded gap, never an implied identity mapping. Adding this file does not make the
# target complete, supported or game-verified.
#
# Rules this file is validated against (crates/tdb-canonical): see the head of
# defs/adapters/nhl15-xbox360.toml — identical contract, `target-adapter/2`.
#
# Confidence, per fact:
#   measured — read directly out of committed evidence (the schema snapshot, an audit's table, a
#              matrix row for `xbox360,nhl07`, a named case that lists this anchor or this fixture);
#   derived  — a measured fact on other material plus a stated argument that it carries here;
#   asserted — recorded from repository source/prose with a citation, not independently measured.

schema = "target-adapter/2"
adapter_version = 2
canonical_schema_version = 1
target = "nhl07-xbox360"
generation = "gen6"
endian = "big"
