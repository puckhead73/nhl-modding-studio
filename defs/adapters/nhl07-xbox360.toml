# --------------------------------------------------------------------------------------------
# Companion / cardinality — GEN6 MODEL. A Player is the `ubPc` bio row plus TWO companion rows that
# SHARE its primary key `wBIz` (measured: `wBIz`, named `game_id`, is the key field on ubPc and on
# both companions in this snapshot). There are NO equipment companions on this title: `xmja`
# (`exhibitionskaterequipment`) and `fMVl` (`exhibitiongoalieequipment`) do not exist in this
# snapshot, and the NHL 08+ four-companion rule was NOT carried here. MEASURED on this anchor
# (C0-REG5): each companion table holds one row per key, every key resolves to a bio row, the table
# EA names `exhibitionskaterai` holds exactly 2015 players and the one it names `exhibitiongoalieai`
# exactly 235, the sets are disjoint and together cover all 2250 bio rows.
# --------------------------------------------------------------------------------------------

[[companion_rule]]
primary_table = "ubPc"
[companion_rule.declared]
state = "established"
confidence = "measured"
provenance = [
  "crates/tdb-canonical/src/target_early_tests.rs#nhl07_xbox360::position_codes_partition_the_bio_table_exactly_as_the_metadata_named_companions_do",
  "docs/audits/data/schema/xbox360-nhl07.json#dSvy (exhibitionskaterai)",
  "docs/audits/data/schema/xbox360-nhl07.json#mHuy (exhibitiongoalieai)",
  "docs/audits/data/operation-matrix.csv#xbox360,nhl07",
]
note = "MEASURED on this anchor by the named case (C0-REG5); the skater/goalie label of each companion is EA's metadata table name, not an enum file. One-to-one: 2015 distinct keys in dSvy, 235 in mHuy, none duplicated, all resolving to a bio row. Two companions only: the equipment tables of NHL 08 onwards are absent from this gen6 snapshot. operation-matrix.csv (create-skater / create-goalie / clone / delete on `xbox360,nhl07`) is retained as corroboration; the roster-relationships audit was verified on nhl11 -> legacy anchors only and is not relied on here."
[companion_rule.declared.value]
shared_key_field = "wBIz"
[[companion_rule.declared.value.companion]]
table = "dSvy"
cardinality = "one-to-one"
applies_when = "position-skater"
[[companion_rule.declared.value.companion]]
table = "mHuy"
cardinality = "one-to-one"
applies_when = "position-goalie"

# The 3-bit width and 0..7 range are measured in the snapshot. The code ASSIGNMENT is MEASURED on
# this anchor (C0-REG5): the 235 bio rows that own rows in the metadata-named goalie companion
# table all store 4 and nothing else; the 2015 that own skater companion rows store exactly
# {0, 1, 2, 3} (462 / 406 / 432 / 715); no row is unassigned. `defs/enums/position.toml` (an
# uncommitted `NHL Legacy default.db`, five named players) was NOT the source of the expected labels
# — EA's metadata table names were — and it agrees. What 0..3 mean individually is NOT established here.
[position_discriminator]
state = "established"
confidence = "measured"
provenance = [
  "crates/tdb-canonical/src/target_early_tests.rs#nhl07_xbox360::position_codes_partition_the_bio_table_exactly_as_the_metadata_named_companions_do",
  "docs/audits/data/schema/xbox360-nhl07.json#ubPc.vjla",
  "docs/audits/data/schema/xbox360-nhl07.json#mHuy (exhibitiongoalieai)",
  "docs/audits/data/schema/xbox360-nhl07.json#dSvy (exhibitionskaterai)",
]
note = "MEASURED on this anchor: goalie code {4} and skater codes {0, 1, 2, 3} partition the 2250 bio rows exactly as ownership of a row in the EA-named goalie / skater companion tables does. Codes 5..7 of the 3-bit field are stored on no row. The per-code labels of 0..3 (centre, wings, defence) are not established here and are not declared."
[position_discriminator.value]
table = "ubPc"
field = "vjla"
skater_codes = [0, 1, 2, 3]
goalie_codes = [4]
