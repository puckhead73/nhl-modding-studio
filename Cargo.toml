# NHL Modding Studio — Cargo workspace (Rust engine).
# The engine crates are Tauri-independent (pure, testable); the Tauri app joins the
# workspace in a later Phase 0 step. See docs/DESIGN.md.
[workspace]
resolver = "2"
members = [
    "crates/tdb-core",
    "crates/tdb-defs",
    "crates/tdb-enums",
    "crates/tdb-relations",
    "crates/tdb-domain-validation",
    "crates/tdb-savedata",
    "crates/tdb-archive-codec",
    "crates/tdb-archive-big",
    "crates/tdb-edit",
    "crates/studio-domain",
    "crates/studio-api",
    "src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.96"
publish = false

[profile.release]
opt-level = 3
