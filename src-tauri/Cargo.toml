[package]
name = "nhl-studio"
description = "NHL Modding Studio — Tauri desktop app."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "nhl_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
studio-api = { path = "../crates/studio-api" }

# Receipt 46: a native message box when the window cannot be created (e.g. no WebView2 Runtime). The same
# `windows` version the Tauri stack already links; no new crate enters the build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
